name: Release

on:
  push:
    tags:
      - 'v*'

# packages: write — the ubuntu binaries leg pushes the ohd image to ghcr.
permissions:
  contents: write
  packages: write

# The vite production builds need more than the runners' ~2GB default
# Node heap.
env:
  NODE_OPTIONS: --max-old-space-size=4096
  # Where release artifacts land; the update feed's pointer files carry
  # absolute URLs into this repo's release pages (DISTRIBUTION_PLAN §3).
  RELEASE_REPO: OpenHeaders/open-headers-releases
  R2_BUCKET: oh-updates

jobs:
  build-desktop:
    if: ${{ !contains(github.ref_name, '-ext') }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One OS leg failing must not cancel the others — the release job
      # publishes whatever legs produced artifacts.
      fail-fast: false
      matrix:
        # windows-2022 (not -latest): windows-latest ships Visual Studio 2026,
        # which the node-gyp bundled with electron-builder cannot detect, so
        # the native-module rebuild fails. VS 2022 stays detectable here.
        os: [macos-latest, windows-2022, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install Python setuptools (Windows)
        if: matrix.os == 'windows-2022'
        run: pip install setuptools
        shell: bash

      - name: Install RPM tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm librpm-dev
          rpm --version

      - name: Create Electron cache directories
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            mkdir -p ~/.cache/electron ~/.cache/electron-builder
          elif [ "$RUNNER_OS" == "macOS" ]; then
            mkdir -p ~/Library/Caches/electron ~/Library/Caches/electron-builder ~/.electron
          elif [ "$RUNNER_OS" == "Windows" ]; then
            mkdir -p ~/AppData/Local/electron/Cache ~/AppData/Local/electron-builder/Cache ~/.electron
          fi

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.electron
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Prepare build directory
        run: |
          rm -rf apps/desktop/dist
          mkdir -p apps/desktop/dist
        shell: bash

      - name: Install dependencies
        run: |
          if [ -n "${{ secrets.PACKAGES_PAT }}" ]; then
            echo "@openheaders:registry=https://npm.pkg.github.com" >> ~/.npmrc
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_PAT }}" >> ~/.npmrc
          else
            echo "@openheaders:registry=https://npm.pkg.github.com" >> ~/.npmrc
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
          fi
          pnpm install --frozen-lockfile
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

      - name: Build core package
        run: pnpm --filter @openheaders/core build

      - name: Build desktop application
        run: pnpm --filter @openheaders/desktop build
        env:
          NODE_ENV: production

      - name: Setup macOS code signing
        if: matrix.os == 'macos-latest'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Clean electron-builder cache
        run: |
          rm -rf apps/desktop/dist
          mkdir -p apps/desktop/dist
        shell: bash

      - name: Detect beta build
        id: detect_beta
        run: |
          if [[ "${{ github.ref_name }}" =~ -beta[.0-9]*$ ]]; then
            echo "is_beta=true" >> $GITHUB_OUTPUT
          else
            echo "is_beta=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Verify desktop version matches tag
        run: |
          TAG="${GITHUB_REF_NAME/v/}"
          PKG_VERSION=$(node -p "require('./apps/desktop/package.json').version")

          # Extract base version (strip -beta.N suffix)
          TAG_BASE=$(echo "$TAG" | sed 's/-beta\.[0-9]*$//')
          PKG_BASE=$(echo "$PKG_VERSION" | sed 's/-beta\.[0-9]*$//')

          if [ "$TAG_BASE" != "$PKG_BASE" ]; then
            echo "::error::Version mismatch! Tag base is $TAG_BASE but apps/desktop/package.json base is $PKG_BASE"
            echo "::error::Bump apps/desktop/package.json to $TAG_BASE and commit before tagging."
            exit 1
          fi

          echo "Desktop version verified: tag=$TAG, package.json=$PKG_VERSION (base: $TAG_BASE)"

          # Set the full tag version in package.json for the build
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('apps/desktop/package.json'));p.version='$TAG';fs.writeFileSync('apps/desktop/package.json',JSON.stringify(p,null,2)+'\n')"
        shell: bash

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop
        run: pnpm dist:mac
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows
        if: matrix.os == 'windows-2022'
        working-directory: apps/desktop
        run: pnpm dist:win:unsigned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Secrets are not readable in step `if:` expressions, so surface
      # their presence as an output; missing credentials mean the
      # Setup.exe ships unsigned instead of failing the leg.
      - name: Check Windows signing credentials
        if: matrix.os == 'windows-2022'
        id: win_sign
        run: |
          if [ -n "$ES_USERNAME" ] && [ -n "$ES_PASSWORD" ] && [ -n "$CREDENTIAL_ID" ] && [ -n "$ES_TOTP_SECRET" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::notice::Windows signing secrets not configured - publishing unsigned Setup.exe"
          fi
        shell: bash
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}

      - name: Find Windows Executable
        if: matrix.os == 'windows-2022' && steps.detect_beta.outputs.is_beta != 'true' && steps.win_sign.outputs.enabled == 'true'
        id: find-exe
        run: |
          $exeFile = Get-ChildItem -Path "apps/desktop/dist" -Filter "*-Setup.exe" -File | Select-Object -First 1
          if ($null -eq $exeFile) { Write-Error "No Setup.exe found"; exit 1 }
          Write-Host "Found: $($exeFile.Name)"
          echo "EXE_FILENAME=$($exeFile.Name)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Sign Windows Executables
        if: matrix.os == 'windows-2022' && steps.detect_beta.outputs.is_beta != 'true' && steps.win_sign.outputs.enabled == 'true'
        uses: sslcom/esigner-codesign@v1.3.1
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: apps/desktop/dist/${{ steps.find-exe.outputs.EXE_FILENAME }}
          malware_block: true
          override: true
          environment_name: PROD
          clean_logs: false
          jvm_max_memory: 1024M
          signing_method: v1

      - name: Update latest.yml and blockmap after signing
        if: matrix.os == 'windows-2022' && steps.detect_beta.outputs.is_beta != 'true' && steps.win_sign.outputs.enabled == 'true'
        run: |
          $exePath = "apps/desktop/dist/${{ steps.find-exe.outputs.EXE_FILENAME }}"
          $blockmapPath = "$exePath.blockmap"
          $latestYmlPath = "apps/desktop/dist/latest.yml"

          $appBuilder = "apps/desktop/node_modules\app-builder-bin\win\x64\app-builder.exe"
          if (-not (Test-Path $appBuilder)) {
            $appBuilder = Get-ChildItem -Path "apps/desktop/node_modules" -Recurse -Filter "app-builder.exe" | Select-Object -First 1 -ExpandProperty FullName
          }

          if ($appBuilder -and (Test-Path $appBuilder)) {
            & $appBuilder blockmap --input $exePath --output $blockmapPath --compression gzip
          }

          $hash = Get-FileHash -Path $exePath -Algorithm SHA512
          $hashBytes = [byte[]]::new($hash.Hash.Length / 2)
          for ($i = 0; $i -lt $hash.Hash.Length; $i += 2) {
            $hashBytes[$i / 2] = [Convert]::ToByte($hash.Hash.Substring($i, 2), 16)
          }
          $base64Hash = [Convert]::ToBase64String($hashBytes)
          $fileSize = (Get-Item $exePath).Length

          $content = Get-Content $latestYmlPath -Raw
          $content = $content -replace 'sha512: [A-Za-z0-9+/=]+', "sha512: $base64Hash"
          $content = $content -replace 'size: \d+', "size: $fileSize"
          Set-Content -Path $latestYmlPath -Value $content -NoNewline
        shell: pwsh

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/desktop
        run: |
          pnpm dist:linux

          if [ $(find dist -name "*.rpm" -type f | wc -l) -eq 0 ]; then
            echo "::warning::RPM packages not found, trying explicit build..."
            pnpm dist:linux:rpm:x64
            pnpm dist:linux:rpm:arm64
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.msi
            apps/desktop/dist/*.pkg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/*.yml
            apps/desktop/dist/install-open-headers.sh

  # Standalone `oh` (all three OSes) and `ohd` (macOS/Linux — win32 is
  # not a daemon target) are seconds of build next to the desktop legs,
  # so every release ships them. Versions come from each app's own
  # package.json (the extension precedent) — the tag stays the
  # desktop's version axis.
  build-binaries:
    if: ${{ !contains(github.ref_name, '-ext') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pack:sea builds the SEA bundle, injects it into the runner's
      # Node, and verifies the binary's contract before anything ships.
      - name: Build and verify oh SEA binary
        run: |
          pnpm turbo build --filter=@openheaders/cli
          pnpm --filter @openheaders/cli run pack:sea
        shell: bash

      # The daemon binary embeds the built web app when present.
      - name: Build and verify ohd SEA binary
        if: matrix.os != 'windows-2022'
        run: |
          pnpm turbo build --filter=@openheaders/daemon --filter=@openheaders/web
          pnpm --filter @openheaders/daemon run pack:sea
        shell: bash

      - name: Setup macOS code signing
        if: matrix.os == 'macos-latest'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      # pack:sea leaves ad-hoc signatures; re-sign with Developer ID
      # (hardened runtime + timestamp, required for notarization), then
      # notarize both binaries in one submission. Flat binaries can't
      # be stapled — Gatekeeper resolves the ticket from Apple's
      # servers on first quarantined run.
      - name: Sign and notarize binaries (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in the keychain"
            exit 1
          fi
          mkdir -p notarize-stage
          # Hardened runtime without the JIT entitlements SIGTRAPs V8 on
          # user machines (the runner's own probe does not enforce them).
          for BINARY in apps/cli/dist-sea/oh apps/daemon/dist-sea/ohd; do
            codesign --force --sign "$IDENTITY" --options runtime --timestamp \
              --entitlements .github/sea-entitlements.plist "$BINARY"
            codesign --verify --strict "$BINARY"
            codesign -d --entitlements - "$BINARY" 2>&1 | grep -q allow-jit
            # The signed binary must still answer
            "$BINARY" --version
            cp "$BINARY" notarize-stage/
          done
          ditto -c -k notarize-stage notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # The container is the same verified SEA binary in an LTS base;
      # the probe re-runs boot + /healthz inside it before anything is
      # pushed (glibc drift between runner and base would surface here).
      # ghcr is a recoverable channel like GitHub Releases, so it rides
      # the pipeline; :latest stays off beta tags.
      - name: Build and push ohd Docker image
        if: matrix.os == 'ubuntu-latest' && github.repository == 'OpenHeaders/open-headers-app'
        run: |
          OHD_VERSION=$(node -p "require('./apps/daemon/package.json').version")
          IMAGE=ghcr.io/openheaders/ohd

          docker build -t "$IMAGE:$OHD_VERSION" apps/daemon
          docker run --rm "$IMAGE:$OHD_VERSION" --version

          CONTAINER=$(docker run -d -p 18637:8137 "$IMAGE:$OHD_VERSION")
          HEALTHY=""
          for _ in $(seq 1 60); do
            if curl -fs http://127.0.0.1:18637/healthz > /dev/null; then
              HEALTHY=1
              break
            fi
            sleep 1
          done
          if [ -z "$HEALTHY" ]; then
            docker logs "$CONTAINER"
            echo "::error::ohd container never answered /healthz"
            exit 1
          fi
          docker rm -f "$CONTAINER"

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$OHD_VERSION"
          if [[ ! "$GITHUB_REF_NAME" =~ -beta ]]; then
            docker tag "$IMAGE:$OHD_VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
        shell: bash

      - name: Stage binary assets
        run: |
          mkdir -p release-binaries
          OH_VERSION=$(node -p "require('./apps/cli/package.json').version")
          case "${{ matrix.os }}" in
            macos-latest) OS_ARCH=mac-arm64 ;;
            ubuntu-latest) OS_ARCH=linux-x64 ;;
            windows-2022) OS_ARCH=win-x64 ;;
          esac
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp apps/cli/dist-sea/oh.exe "release-binaries/oh-${OH_VERSION}-${OS_ARCH}.exe"
          else
            OHD_VERSION=$(node -p "require('./apps/daemon/package.json').version")
            cp apps/cli/dist-sea/oh "release-binaries/oh-${OH_VERSION}-${OS_ARCH}"
            cp apps/daemon/dist-sea/ohd "release-binaries/ohd-${OHD_VERSION}-${OS_ARCH}"
          fi
        shell: bash

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: release-binaries/*

  build-extension:
    # Public-repo releases only: the desktop release loop on a private
    # mirror doesn't need extension zips (the store owns distribution).
    if: ${{ !contains(github.ref_name, '-ext') && github.repository == 'OpenHeaders/open-headers-app' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Align extension manifests with package.json version
        id: ext_version
        working-directory: apps/extension
        run: |
          TAG="${GITHUB_REF_NAME/v/}"
          EXT_VERSION=$(node -p "require('./package.json').version")

          # If the tag has a beta suffix, apply it to the extension version too
          if [[ "$TAG" =~ (-beta\.[0-9]+)$ ]]; then
            BETA_SUFFIX="${BASH_REMATCH[1]}"
            EXT_BASE=$(echo "$EXT_VERSION" | sed 's/-beta\.[0-9]*$//')
            EXT_VERSION="${EXT_BASE}${BETA_SUFFIX}"
            node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json'));p.version='$EXT_VERSION';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          fi

          echo "version=$EXT_VERSION" >> $GITHUB_OUTPUT

          # Compute numeric manifest version for store compatibility
          if [[ "$EXT_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-beta\.([0-9]+)$ ]]; then
            MANIFEST_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          else
            MANIFEST_VERSION="$EXT_VERSION"
          fi

          echo "Extension version: $EXT_VERSION (manifest: $MANIFEST_VERSION)"

          for manifest in manifests/*/manifest.json; do
            node -e "const fs=require('fs'),m=JSON.parse(fs.readFileSync('$manifest'));m.version='$MANIFEST_VERSION';fs.writeFileSync('$manifest',JSON.stringify(m,null,2)+'\n')"
          done

      - name: Build core package
        run: pnpm --filter @openheaders/core build

      # OH_EXT_CHANNEL=release ships fully mangled builds; store
      # packages are built without it (review-permissive).
      - name: Build and package extensions
        working-directory: apps/extension
        run: pnpm release
        env:
          OH_EXT_CHANNEL: release

      - name: Write extension version file
        run: |
          mkdir -p apps/extension/releases
          echo "${{ steps.ext_version.outputs.version }}" > apps/extension/releases/EXT_VERSION.txt

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: |
            apps/extension/releases/*.zip
            apps/extension/releases/EXT_VERSION.txt

  release:
    # Runs as long as the workflow wasn't cancelled — a failed OS leg or
    # a skipped extension job still yields a release from the legs that
    # produced artifacts.
    if: ${{ !contains(github.ref_name, '-ext') && !cancelled() && needs.build-desktop.result != 'cancelled' }}
    needs: [build-desktop, build-extension, build-binaries]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine release type
        id: release_type
        run: |
          TAG_NAME=${GITHUB_REF_NAME}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          if [[ "$TAG_NAME" =~ -beta[.0-9]*$ ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Read extension version
        id: ext_ver
        if: needs.build-extension.result == 'success'
        run: |
          EXT_VERSION=$(cat dist/extension-packages/EXT_VERSION.txt)
          echo "version=$EXT_VERSION" >> $GITHUB_OUTPUT
          echo "Extension version: $EXT_VERSION"

      - name: Process artifacts for release
        run: |
          mkdir -p processed_files
          VERSION=${GITHUB_REF_NAME/v/}

          # Desktop artifacts
          if [ -d "dist/desktop-windows-2022" ]; then
            cp dist/desktop-windows-2022/*.exe processed_files/ 2>/dev/null || true
            cp dist/desktop-windows-2022/*.msi processed_files/ 2>/dev/null || true
            cp dist/desktop-windows-2022/*.blockmap processed_files/ 2>/dev/null || true
            cp dist/desktop-windows-2022/latest.yml processed_files/ 2>/dev/null || true
          fi

          if [ -d "dist/desktop-macos-latest" ]; then
            cp dist/desktop-macos-latest/*.dmg processed_files/ 2>/dev/null || true
            cp dist/desktop-macos-latest/*.pkg processed_files/ 2>/dev/null || true
            cp dist/desktop-macos-latest/*.zip processed_files/ 2>/dev/null || true
            cp dist/desktop-macos-latest/*.blockmap processed_files/ 2>/dev/null || true
            cp dist/desktop-macos-latest/latest-mac.yml processed_files/ 2>/dev/null || true
          fi

          if [ -d "dist/desktop-ubuntu-latest" ]; then
            cp dist/desktop-ubuntu-latest/*.AppImage processed_files/ 2>/dev/null || true
            cp dist/desktop-ubuntu-latest/*.deb processed_files/ 2>/dev/null || true
            find dist/desktop-ubuntu-latest -name "*.rpm" -exec cp {} processed_files/ \; 2>/dev/null || true
            cp dist/desktop-ubuntu-latest/install-open-headers.sh processed_files/ 2>/dev/null || true
            cp dist/desktop-ubuntu-latest/latest-linux.yml processed_files/ 2>/dev/null || true
            cp dist/desktop-ubuntu-latest/latest-linux-arm64.yml processed_files/ 2>/dev/null || true
          fi

          # Extension artifacts (zips only, not the version file)
          if [ -d "dist/extension-packages" ]; then
            cp dist/extension-packages/*.zip processed_files/ 2>/dev/null || true
          fi

          # Standalone oh/ohd binaries + one checksums file over them
          find dist -path 'dist/binaries-*' -type f -exec cp {} processed_files/ \;
          BINS=$(cd processed_files && ls oh-* ohd-* 2>/dev/null || true)
          if [ -n "$BINS" ]; then
            (cd processed_files && shasum -a 256 $BINS > SHA256SUMS.txt)
            # Installer scripts ride every release so the stable
            # /releases/latest/download one-liners always resolve.
            cp apps/cli/scripts/install.sh processed_files/install-oh.sh
            cp apps/cli/scripts/install.ps1 processed_files/install-oh.ps1
          fi

          echo "Files prepared for release:"
          ls -la processed_files/
        shell: bash

      # versions.json — the static severity manifest (UPDATES_PLAN §4).
      # Clients fetch it anonymously via /releases/latest/download/,
      # which resolves to the newest non-prerelease, so beta tags never
      # move it. Severity is authored in .github/release-severity.json
      # before tagging, never inferred.
      - name: Generate versions manifest
        run: |
          node scripts/generate-versions-manifest.mjs "$GITHUB_REF_NAME" > processed_files/versions.json
          cat processed_files/versions.json

      - name: Generate Release Body
        run: |
          VERSION=${GITHUB_REF_NAME/v/}
          EXT_VERSION="${{ steps.ext_ver.outputs.version }}"
          IS_PRERELEASE="${{ steps.release_type.outputs.is_prerelease }}"
          REPO="$RELEASE_REPO"
          TAG="$GITHUB_REF_NAME"

          DL="https://github.com/${REPO}/releases/download/${TAG}"
          ICONS="https://raw.githubusercontent.com/${REPO}/main/assets"

          {
            echo "<p align=\"center\"><img src=\"${ICONS}/logo.svg\" width=\"88\" alt=\"Open Headers\"></p>"
            echo ""
          } > release_body.md

          if [ "$IS_PRERELEASE" = "true" ]; then
            echo '> **This is a beta build for early testing.** It may contain bugs.' >> release_body.md
            echo '' >> release_body.md
          fi

          # Brand icons live in the releases repo's assets/ directory —
          # markdown img tags are the only way GitHub renders svg in a
          # release body.
          icon() { echo "<img src=\"${ICONS}/$1.svg\" width=\"16\" align=\"center\">"; }
          I_MAC=$(icon macos)
          I_WIN=$(icon windows)
          I_LINUX=$(icon linux)
          I_DEBIAN=$(icon debian)
          I_FEDORA=$(icon fedora)
          I_CHROME=$(icon chrome)
          I_FIREFOX=$(icon firefox)
          I_EDGE=$(icon edge)
          I_SAFARI=$(icon safari)

          {
            echo "## Desktop App v${VERSION}"
            echo ""
            echo "| Platform | Downloads |"
            echo "| --- | --- |"
            echo "| ${I_MAC} macOS | [Apple Silicon (DMG)](${DL}/OpenHeaders-${VERSION}-mac-arm64.dmg) · [Intel (DMG)](${DL}/OpenHeaders-${VERSION}-mac-x64.dmg) |"
            echo "| ${I_WIN} Windows | [Installer (EXE)](${DL}/OpenHeaders-${VERSION}-Setup.exe) |"
            echo "| ${I_LINUX} Linux | [AppImage x64](${DL}/OpenHeaders-${VERSION}-x64.AppImage) · [AppImage ARM64](${DL}/OpenHeaders-${VERSION}-arm64.AppImage) · [install script](${DL}/install-open-headers.sh) |"
            echo "| ${I_DEBIAN} Debian / Ubuntu | [x64 (deb)](${DL}/open-headers_${VERSION}_amd64.deb) · [ARM64 (deb)](${DL}/open-headers_${VERSION}_arm64.deb) |"
            echo "| ${I_FEDORA} Fedora / RHEL | [x64 (rpm)](${DL}/open-headers-${VERSION}.x86_64.rpm) · [ARM64 (rpm)](${DL}/open-headers-${VERSION}.aarch64.rpm) |"
            echo ""
            echo "**Managed deployment (MDM / GPO):** [PKG Apple Silicon](${DL}/OpenHeaders-${VERSION}-mac-arm64.pkg) · [PKG Intel](${DL}/OpenHeaders-${VERSION}-mac-x64.pkg) · [MSI](${DL}/OpenHeaders-${VERSION}.msi)"
          } >> release_body.md

          if [ -n "$EXT_VERSION" ]; then
            {
              echo ""
              echo "## Browser Extension v${EXT_VERSION}"
              echo ""
              echo "| Browser | Download |"
              echo "| --- | --- |"
              echo "| ${I_CHROME} Chrome | [open-headers-chrome-v${EXT_VERSION}.zip](${DL}/open-headers-chrome-v${EXT_VERSION}.zip) |"
              echo "| ${I_FIREFOX} Firefox | [open-headers-firefox-v${EXT_VERSION}.zip](${DL}/open-headers-firefox-v${EXT_VERSION}.zip) |"
              echo "| ${I_EDGE} Edge | [open-headers-edge-v${EXT_VERSION}.zip](${DL}/open-headers-edge-v${EXT_VERSION}.zip) |"
              echo "| ${I_SAFARI} Safari | [open-headers-safari-v${EXT_VERSION}.zip](${DL}/open-headers-safari-v${EXT_VERSION}.zip) |"
            } >> release_body.md
          fi

          # oh/ohd binaries carry their own app versions — list what
          # the legs actually staged.
          BIN_FILES=$(cd processed_files && ls oh-* ohd-* 2>/dev/null || true)
          if [ -n "$BIN_FILES" ]; then
            {
              echo ""
              echo "## CLI & Daemon (standalone binaries)"
              echo ""
              echo "No Node.js required (\`npm install -g @openheaders/cli\` is the Node channel). macOS binaries are signed and notarized; the Windows \`oh\` is unsigned — SmartScreen warns on first run (More info → Run anyway)."
              echo ""
              echo "Install script (verifies checksums, installs to \`~/.local/bin\`; add \`--with-daemon\` for \`ohd\`):"
              echo ""
              echo '```sh'
              echo "curl -fsSL https://updates.openheaders.io/install.sh | sh"
              echo '```'
              echo ""
              echo "Windows (PowerShell):"
              echo ""
              echo '```powershell'
              echo "irm https://updates.openheaders.io/install.ps1 | iex"
              echo '```'
              echo ""
              echo "| Binary | Platform | Download |"
              echo "| --- | --- | --- |"
              for f in $BIN_FILES; do
                case "$f" in
                  ohd-*) BIN_NAME='`ohd`' ;;
                  *) BIN_NAME='`oh`' ;;
                esac
                case "$f" in
                  *-mac-arm64) PLATFORM="${I_MAC} macOS (Apple Silicon)" ;;
                  *-mac-x64) PLATFORM="${I_MAC} macOS (Intel)" ;;
                  *-linux-x64) PLATFORM="${I_LINUX} Linux (x64)" ;;
                  *-linux-arm64) PLATFORM="${I_LINUX} Linux (ARM64)" ;;
                  *-win-x64.exe) PLATFORM="${I_WIN} Windows (x64)" ;;
                  *) PLATFORM="${f}" ;;
                esac
                echo "| ${BIN_NAME} | ${PLATFORM} | [${f}](${DL}/${f}) |"
              done
              echo ""
              echo "Checksums: [SHA256SUMS.txt](${DL}/SHA256SUMS.txt) · Scripts: [install-oh.sh](${DL}/install-oh.sh) · [install-oh.ps1](${DL}/install-oh.ps1)"
            } >> release_body.md
          fi

          # Docker (daemon) — version comes from the staged ohd asset name.
          OHD_DOCKER_VERSION=$(echo "$BIN_FILES" | tr ' ' '\n' | sed -n 's/^ohd-\([0-9][^ ]*\)-linux-x64$/\1/p' | head -1)
          if [ -n "$OHD_DOCKER_VERSION" ]; then
            {
              echo ""
              echo "## Docker (daemon)"
              echo ""
              echo '```sh'
              echo "docker run -d -p 8137:8137 -v oh-data:/data ghcr.io/openheaders/ohd:${OHD_DOCKER_VERSION}"
              echo '```'
            } >> release_body.md
          fi

      # Artifacts + the electron-updater feed files (latest*.yml) land on
      # the public releases repo — the app's update check stays anonymous
      # (no token) while the source repo stays private.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASES_PAT }}
          repository: OpenHeaders/open-headers-releases
          tag_name: "${{ github.ref_name }}"
          draft: false
          prerelease: ${{ steps.release_type.outputs.is_prerelease == 'true' }}
          name: "${{ github.ref_name }}"
          files: processed_files/*
          fail_on_unmatched_files: false
          body_path: release_body.md
          generate_release_notes: false
          append_body: true

      # The update feed: static pointer files on R2 behind
      # updates.openheaders.io (DISTRIBUTION_PLAN §3). The yml/json
      # pointers carry absolute URLs to this release's GitHub assets, so
      # staging happens only after the release exists. A beta tag stages
      # only beta/ paths — stable pointers can never move.
      - name: Stage update feed pointers
        run: |
          node scripts/generate-update-feed.mjs "$GITHUB_REF_NAME" \
            "https://github.com/${RELEASE_REPO}/releases/download/${GITHUB_REF_NAME}" \
            processed_files feed
          find feed -type f | sort

      # Secrets are not readable in step `if:` expressions; missing R2
      # credentials skip the upload with a warning instead of failing
      # the release.
      - name: Check R2 credentials
        id: r2
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::R2 secrets not configured — update feed not uploaded this release"
          fi
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Upload update feed to R2
        if: steps.r2.outputs.enabled == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          # aws-cli ≥ 2.23 defaults to CRC32 request checksums, which
          # R2's S3 layer rejects.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          find feed -type f | while read -r file; do
            KEY="${file#feed/}"
            case "$file" in
              *.yml)  TYPE="text/yaml" ;;
              *.json) TYPE="application/json" ;;
              *.ps1)  TYPE="text/plain; charset=utf-8" ;;
              *.sh)   TYPE="text/x-shellscript; charset=utf-8" ;;
              *)      TYPE="application/octet-stream" ;;
            esac
            # Short cache so a fresh release is visible within minutes
            # of the pointer upload — clients check at most daily.
            aws s3 cp "$file" "s3://${R2_BUCKET}/${KEY}" \
              --endpoint-url "$ENDPOINT" --region auto \
              --content-type "$TYPE" \
              --cache-control "public, max-age=300, must-revalidate" \
              --no-progress
          done

      # The extension mirror-publish targets the real public extension
      # repo — it must never fire from a private/mirror build of this
      # workflow.
      - name: Generate extension release body
        if: github.repository == 'OpenHeaders/open-headers-app' && needs.build-extension.result == 'success'
        run: |
          EXT_VERSION="${{ steps.ext_ver.outputs.version }}"
          IS_PRERELEASE="${{ steps.release_type.outputs.is_prerelease }}"
          EXT_TAG="v${EXT_VERSION}"
          DL="https://github.com/OpenHeaders/open-headers-browser-extension/releases/download/${EXT_TAG}"

          ICONS="https://raw.githubusercontent.com/OpenHeaders/open-headers-releases/main/assets"
          icon() { echo "<img src=\"${ICONS}/$1.svg\" width=\"16\" align=\"center\">"; }

          {
            echo "<p align=\"center\"><img src=\"${ICONS}/logo.svg\" width=\"88\" alt=\"Open Headers\"></p>"
            echo ""
          } > ext_release_body.md

          if [ "$IS_PRERELEASE" = "true" ]; then
            echo '> **This is a beta build for early testing.** It may contain bugs.' >> ext_release_body.md
            echo '' >> ext_release_body.md
          fi

          {
            echo "## Browser Extension Downloads"
            echo ""
            echo "| Browser | Download |"
            echo "| --- | --- |"
            echo "| $(icon chrome) Chrome | [open-headers-chrome-v${EXT_VERSION}.zip](${DL}/open-headers-chrome-v${EXT_VERSION}.zip) |"
            echo "| $(icon firefox) Firefox | [open-headers-firefox-v${EXT_VERSION}.zip](${DL}/open-headers-firefox-v${EXT_VERSION}.zip) |"
            echo "| $(icon edge) Edge | [open-headers-edge-v${EXT_VERSION}.zip](${DL}/open-headers-edge-v${EXT_VERSION}.zip) |"
            echo "| $(icon safari) Safari | [open-headers-safari-v${EXT_VERSION}.zip](${DL}/open-headers-safari-v${EXT_VERSION}.zip) |"
            echo ""
            echo "### Installation"
            echo "1. Download the zip for your browser"
            echo "2. Extract to a folder"
            echo '3. Chrome/Edge: Go to `chrome://extensions`, enable Developer mode, click Load unpacked'
            echo '4. Firefox: Go to `about:debugging#/runtime/this-firefox`, click Load Temporary Add-on'
          } >> ext_release_body.md

      - name: Publish extension to browser extension repo
        if: github.repository == 'OpenHeaders/open-headers-app' && needs.build-extension.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.EXTENSION_REPO_PAT }}
          repository: OpenHeaders/open-headers-browser-extension
          tag_name: "v${{ steps.ext_ver.outputs.version }}"
          draft: false
          prerelease: ${{ steps.release_type.outputs.is_prerelease == 'true' }}
          name: "v${{ steps.ext_ver.outputs.version }}"
          files: dist/extension-packages/*.zip
          body_path: ext_release_body.md
