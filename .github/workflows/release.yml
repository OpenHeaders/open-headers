name: Release

on:
  push:
    tags:
      - 'v*'
  # Signing dry-run: manual dispatch builds ONLY the windows desktop
  # leg with the full stable eSigner path (inner OpenHeaders.exe +
  # oh-nm-host.exe → installers → sign → re-hash → blockmap →
  # signature checks) and uploads the artifact — no binaries/extension
  # legs, no release job, nothing published.
  workflow_dispatch:

# packages: write — the ubuntu binaries leg pushes the ohd image to ghcr.
permissions:
  contents: write
  packages: write

# The vite production builds need more than the runners' ~2GB default
# Node heap.
env:
  NODE_OPTIONS: --max-old-space-size=4096
  # Where release artifacts land; the update feed's pointer files carry
  # absolute URLs into this repo's release pages.
  RELEASE_REPO: OpenHeaders/open-headers
  R2_BUCKET: oh-updates

jobs:
  build-desktop:
    if: ${{ !contains(github.ref_name, '-ext') && !contains(github.ref_name, '-cli') && !contains(github.ref_name, '-daemon') }}
    runs-on: ${{ matrix.os }}
    # Shipped-artifact hardening (terser passes, strip-testid runtime,
    # debug-console removal, license-chunk bytecode) — release pipeline
    # only, so local production builds and the e2e target stay
    # untouched. Job-level because the dist:* scripts rebuild via
    # predist: a step-level env on an earlier build step gets its
    # output silently overwritten by that rebuild.
    env:
      OH_DESKTOP_CHANNEL: release
    strategy:
      # One OS leg failing must not cancel the others — the release job
      # publishes whatever legs produced artifacts.
      fail-fast: false
      matrix:
        # macOS and Linux run one leg PER ARCH so the two
        # electron-builder package+notarize passes go in parallel — the
        # release job merges the two one-arch latest-mac.yml files into
        # the single feed pointer (linux update-info files are per-arch
        # named already, no merge). The matrix is computed from the tag
        # shape: beta tags spawn only the legs whose targets betas ship
        # (mac arm64, linux x64); a signing dry-run (workflow_dispatch)
        # builds the windows leg only.
        # windows-2022 (not -latest): windows-latest ships Visual Studio 2026,
        # which the node-gyp bundled with electron-builder cannot detect, so
        # the native-module rebuild fails. VS 2022 stays detectable here.
        include: ${{ github.event_name == 'workflow_dispatch' && fromJSON('[{"os":"windows-2022"}]') || contains(github.ref_name, '-beta') && fromJSON('[{"os":"macos-latest","arch":"arm64"},{"os":"windows-2022"},{"os":"ubuntu-latest","arch":"x64"}]') || fromJSON('[{"os":"macos-latest","arch":"arm64"},{"os":"macos-latest","arch":"x64"},{"os":"windows-2022"},{"os":"ubuntu-latest","arch":"x64"},{"os":"ubuntu-latest","arch":"arm64"}]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install Python setuptools (Windows)
        if: matrix.os == 'windows-2022'
        run: pip install setuptools
        shell: bash

      # macos-latest ships Python 3.12+, which removed distutils; the
      # node-gyp bundled with electron-builder still imports it when
      # rebuilding native modules (node-pty). Put a 3.11 first in PATH.
      - name: Setup Python 3.11 for node-gyp (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # rpm is a stable-only target — betas build AppImage/deb only.
      - name: Install RPM tools (Linux)
        if: matrix.os == 'ubuntu-latest' && !contains(github.ref_name, '-beta')
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm librpm-dev
          rpm --version

      - name: Create Electron cache directories
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            mkdir -p ~/.cache/electron ~/.cache/electron-builder
          elif [ "$RUNNER_OS" == "macOS" ]; then
            mkdir -p ~/Library/Caches/electron ~/Library/Caches/electron-builder ~/.electron
          elif [ "$RUNNER_OS" == "Windows" ]; then
            mkdir -p ~/AppData/Local/electron/Cache ~/AppData/Local/electron-builder/Cache ~/.electron
          fi

      # Arch in the key: the per-arch legs of one OS run concurrently
      # and each caches only its own arch's downloads — a shared key
      # would race on save and leave the loser cold every release.
      - name: Cache Electron
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.electron
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-${{ matrix.arch || 'x64' }}-electron-cache-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch || 'x64' }}-electron-cache-

      - name: Prepare build directory
        run: |
          rm -rf apps/desktop/dist
          mkdir -p apps/desktop/dist
        shell: bash

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Build core package
        run: pnpm --filter @openheaders/core build

      # The leg's five-target matrix name — the NM host and HTTP/3
      # helper builds both compile for it, so the cross-arch legs
      # (mac x64 on arm64 runners, linux arm64 on x64 runners) ship
      # native binaries instead of the runner's.
      - name: Compute leg target
        id: leg_target
        run: |
          case "${{ matrix.os }}" in
            macos-latest) echo "target=mac-${{ matrix.arch }}" >> $GITHUB_OUTPUT ;;
            ubuntu-latest) echo "target=linux-${{ matrix.arch }}" >> $GITHUB_OUTPUT ;;
            *) echo "target=win-x64" >> $GITHUB_OUTPUT ;;
          esac
        shell: bash

      # The NM host rides the app under resources/nm-host (extraResources)
      # — without this step the packaged app ships hostless and the
      # extension degrades to device-flow pairing. One binary per
      # leg, compiled for the leg's own target.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Build NM host binary
        run: pnpm --filter @openheaders/nm-host run pack:bun ${{ steps.leg_target.outputs.target }}
        shell: bash

      # The HTTP/3 helper rides the app under resources/h3-helper (the
      # afterPack per-arch copy) and the ohd SEA payload — without this
      # step the packaged app ships helperless and a '3' send fails
      # honestly. Each per-arch leg builds only its own target (the mac
      # x64 and linux arm64 targets cross-compile on the arm64/x64
      # runners; the script adds the rust target itself).
      - name: Cache cargo (HTTP/3 helper)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/h3-helper/target
          key: ${{ runner.os }}-${{ matrix.arch || 'x64' }}-h3-helper-${{ hashFiles('native/h3-helper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch || 'x64' }}-h3-helper-

      - name: Install linux arm64 cross linker (HTTP/3 helper)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build HTTP/3 helper
        run: node scripts/build-h3-helper.mjs "${{ steps.leg_target.outputs.target }}"
        shell: bash

      - name: Build desktop application
        run: pnpm --filter @openheaders/desktop build
        env:
          NODE_ENV: production

      - name: Setup macOS code signing
        if: matrix.os == 'macos-latest'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Clean electron-builder cache
        run: |
          rm -rf apps/desktop/dist
          mkdir -p apps/desktop/dist
        shell: bash

      - name: Detect beta build
        id: detect_beta
        run: |
          if [[ "${{ github.ref_name }}" =~ -beta[.0-9]*$ ]]; then
            echo "is_beta=true" >> $GITHUB_OUTPUT
          else
            echo "is_beta=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # A dispatch dry-run has a branch ref, not a tag — the build uses
      # the version already in package.json.
      - name: Verify desktop version matches tag
        if: github.event_name != 'workflow_dispatch'
        run: |
          TAG="${GITHUB_REF_NAME/v/}"
          PKG_VERSION=$(node -p "require('./apps/desktop/package.json').version")

          # Extract base version (strip -beta.N suffix)
          TAG_BASE=$(echo "$TAG" | sed 's/-beta\.[0-9]*$//')
          PKG_BASE=$(echo "$PKG_VERSION" | sed 's/-beta\.[0-9]*$//')

          if [ "$TAG_BASE" != "$PKG_BASE" ]; then
            echo "::error::Version mismatch! Tag base is $TAG_BASE but apps/desktop/package.json base is $PKG_BASE"
            echo "::error::Bump apps/desktop/package.json to $TAG_BASE and commit before tagging."
            exit 1
          fi

          echo "Desktop version verified: tag=$TAG, package.json=$PKG_VERSION (base: $TAG_BASE)"

          # Set the full tag version in package.json for the build
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('apps/desktop/package.json'));p.version='$TAG';fs.writeFileSync('apps/desktop/package.json',JSON.stringify(p,null,2)+'\n')"
        shell: bash

      # Betas skip the enterprise formats (pkg/msi) and mac-x64 — beta
      # testers use dmg/zip/Setup.exe; stable tags ship everything. The
      # mac-x64 beta leg never spawns (computed matrix), so the beta
      # branch here is always the arm64 leg.
      - name: Build macOS
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop
        run: |
          if [ "${{ steps.detect_beta.outputs.is_beta }}" == "true" ]; then
            pnpm dist:mac:beta
          else
            pnpm dist:mac:${{ matrix.arch }}
          fi
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Secrets are not readable in step `if:` expressions, so surface
      # their presence as an output; missing credentials mean the
      # Setup.exe ships unsigned instead of failing the leg. Checked
      # before the build because the signed lane packages in two
      # phases (unpacked → sign inner executables → installers).
      - name: Check Windows signing credentials
        if: matrix.os == 'windows-2022'
        id: win_sign
        run: |
          if [ -n "$ES_USERNAME" ] && [ -n "$ES_PASSWORD" ] && [ -n "$CREDENTIAL_ID" ] && [ -n "$ES_TOTP_SECRET" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::notice::Windows signing secrets not configured - publishing unsigned Setup.exe"
          fi
        shell: bash
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}

      - name: Build Windows
        if: matrix.os == 'windows-2022' && (steps.detect_beta.outputs.is_beta == 'true' || steps.win_sign.outputs.enabled != 'true')
        working-directory: apps/desktop
        shell: bash
        run: |
          if [ "${{ steps.detect_beta.outputs.is_beta }}" == "true" ]; then
            pnpm dist:win:unsigned:beta
          else
            pnpm dist:win:unsigned
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Signed stable lane: the installed binaries need Authenticode
      # too — the NM chain's host verification anchors on the signed
      # `oh-nm-host.exe`, and enterprise allow-listing wants a signed
      # `OpenHeaders.exe`. Build unpacked first, sign the two inner
      # executables, then package the installers from the signed tree.
      - name: Build Windows unpacked (signed lane)
        if: matrix.os == 'windows-2022' && steps.detect_beta.outputs.is_beta != 'true' && steps.win_sign.outputs.enabled == 'true'
        working-directory: apps/desktop
        shell: bash
        run: pnpm dist:win:unsigned:dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign app executable
        if: matrix.os == 'windows-2022' && steps.detect_beta.outputs.is_beta != 'true' && steps.win_sign.outputs.enabled == 'true'
        uses: sslcom/esigner-codesign@a272724cb13abe0abc579c6c40f7899969b6942b # v1.3.1
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: apps/desktop/dist/win-unpacked/OpenHeaders.exe
          malware_block: true
          override: true
          environment_name: PROD
          clean_logs: false
          jvm_max_memory: 1024M
          signing_method: v1

      - name: Sign NM host executable
        if: matrix.os == 'windows-2022' && steps.detect_beta.outputs.is_beta != 'true' && steps.win_sign.outputs.enabled == 'true'
        uses: sslcom/esigner-codesign@a272724cb13abe0abc579c6c40f7899969b6942b # v1.3.1
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: apps/desktop/dist/win-unpacked/resources/nm-host/oh-nm-host.exe
          malware_block: true
          override: true
          environment_name: PROD
          clean_logs: false
          jvm_max_memory: 1024M
          signing_method: v1

      # The HTTP/3 helper is a shipped executable too — SmartScreen and
      # enterprise allow-listing want it Authenticode-signed like the
      # other inner binaries.
      - name: Sign HTTP/3 helper executable
        if: matrix.os == 'windows-2022' && steps.detect_beta.outputs.is_beta != 'true' && steps.win_sign.outputs.enabled == 'true'
        uses: sslcom/esigner-codesign@a272724cb13abe0abc579c6c40f7899969b6942b # v1.3.1
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: apps/desktop/dist/win-unpacked/resources/h3-helper/oh-h3-helper.exe
          malware_block: true
          override: true
          environment_name: PROD
          clean_logs: false
          jvm_max_memory: 1024M
          signing_method: v1

      - name: Verify inner executable signatures
        if: matrix.os == 'windows-2022' && steps.detect_beta.outputs.is_beta != 'true' && steps.win_sign.outputs.enabled == 'true'
        run: |
          foreach ($f in @(
            "apps/desktop/dist/win-unpacked/OpenHeaders.exe",
            "apps/desktop/dist/win-unpacked/resources/nm-host/oh-nm-host.exe",
            "apps/desktop/dist/win-unpacked/resources/h3-helper/oh-h3-helper.exe"
          )) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f -> $($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              Write-Error "Authenticode signature status for ${f}: $($sig.Status)"
              exit 1
            }
          }
        shell: pwsh

      - name: Package installers from signed tree
        if: matrix.os == 'windows-2022' && steps.detect_beta.outputs.is_beta != 'true' && steps.win_sign.outputs.enabled == 'true'
        working-directory: apps/desktop
        shell: bash
        run: pnpm dist:win:frompacked
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find Windows Executable
        if: matrix.os == 'windows-2022' && steps.detect_beta.outputs.is_beta != 'true' && steps.win_sign.outputs.enabled == 'true'
        id: find-exe
        run: |
          $exeFile = Get-ChildItem -Path "apps/desktop/dist" -Filter "*-Setup.exe" -File | Select-Object -First 1
          if ($null -eq $exeFile) { Write-Error "No Setup.exe found"; exit 1 }
          Write-Host "Found: $($exeFile.Name)"
          echo "EXE_FILENAME=$($exeFile.Name)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Sign Windows Executables
        if: matrix.os == 'windows-2022' && steps.detect_beta.outputs.is_beta != 'true' && steps.win_sign.outputs.enabled == 'true'
        uses: sslcom/esigner-codesign@a272724cb13abe0abc579c6c40f7899969b6942b # v1.3.1
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: apps/desktop/dist/${{ steps.find-exe.outputs.EXE_FILENAME }}
          malware_block: true
          override: true
          environment_name: PROD
          clean_logs: false
          jvm_max_memory: 1024M
          signing_method: v1

      - name: Update latest.yml and blockmap after signing
        if: matrix.os == 'windows-2022' && steps.detect_beta.outputs.is_beta != 'true' && steps.win_sign.outputs.enabled == 'true'
        run: |
          $exePath = "apps/desktop/dist/${{ steps.find-exe.outputs.EXE_FILENAME }}"
          $blockmapPath = "$exePath.blockmap"
          $latestYmlPath = "apps/desktop/dist/latest.yml"

          $appBuilder = "apps/desktop/node_modules\app-builder-bin\win\x64\app-builder.exe"
          if (-not (Test-Path $appBuilder)) {
            $appBuilder = Get-ChildItem -Path "apps/desktop/node_modules" -Recurse -Filter "app-builder.exe" | Select-Object -First 1 -ExpandProperty FullName
          }

          if ($appBuilder -and (Test-Path $appBuilder)) {
            & $appBuilder blockmap --input $exePath --output $blockmapPath --compression gzip
          }

          $hash = Get-FileHash -Path $exePath -Algorithm SHA512
          $hashBytes = [byte[]]::new($hash.Hash.Length / 2)
          for ($i = 0; $i -lt $hash.Hash.Length; $i += 2) {
            $hashBytes[$i / 2] = [Convert]::ToByte($hash.Hash.Substring($i, 2), 16)
          }
          $base64Hash = [Convert]::ToBase64String($hashBytes)
          $fileSize = (Get-Item $exePath).Length

          $content = Get-Content $latestYmlPath -Raw
          $content = $content -replace 'sha512: [A-Za-z0-9+/=]+', "sha512: $base64Hash"
          $content = $content -replace 'size: \d+', "size: $fileSize"
          Set-Content -Path $latestYmlPath -Value $content -NoNewline
        shell: pwsh

      # An invalid signature must fail the leg — publishing a
      # broken-signed Setup.exe whose hash the feed pointer carries is
      # worse than publishing unsigned.
      - name: Verify Authenticode signature
        if: matrix.os == 'windows-2022' && steps.detect_beta.outputs.is_beta != 'true' && steps.win_sign.outputs.enabled == 'true'
        run: |
          $sig = Get-AuthenticodeSignature "apps/desktop/dist/${{ steps.find-exe.outputs.EXE_FILENAME }}"
          $sig | Format-List Status, StatusMessage
          if ($sig.SignerCertificate) { $sig.SignerCertificate | Format-List Subject, Issuer, NotAfter }
          if ($sig.Status -ne 'Valid') {
            Write-Error "Authenticode signature status: $($sig.Status)"
            exit 1
          }
        shell: pwsh

      # The enterprise MSI rides the same eSigner path as Setup.exe.
      # It carries no feed pointer, so no blockmap/hash rework — sign
      # and verify only.
      - name: Find Windows MSI
        if: matrix.os == 'windows-2022' && steps.detect_beta.outputs.is_beta != 'true' && steps.win_sign.outputs.enabled == 'true'
        id: find-msi
        run: |
          $msiFile = Get-ChildItem -Path "apps/desktop/dist" -Filter "*.msi" -File | Select-Object -First 1
          if ($null -eq $msiFile) { Write-Error "No MSI found"; exit 1 }
          Write-Host "Found: $($msiFile.Name)"
          echo "MSI_FILENAME=$($msiFile.Name)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Sign Windows MSI
        if: matrix.os == 'windows-2022' && steps.detect_beta.outputs.is_beta != 'true' && steps.win_sign.outputs.enabled == 'true'
        uses: sslcom/esigner-codesign@a272724cb13abe0abc579c6c40f7899969b6942b # v1.3.1
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: apps/desktop/dist/${{ steps.find-msi.outputs.MSI_FILENAME }}
          malware_block: true
          override: true
          environment_name: PROD
          clean_logs: false
          jvm_max_memory: 1024M
          signing_method: v1

      - name: Verify MSI Authenticode signature
        if: matrix.os == 'windows-2022' && steps.detect_beta.outputs.is_beta != 'true' && steps.win_sign.outputs.enabled == 'true'
        run: |
          $sig = Get-AuthenticodeSignature "apps/desktop/dist/${{ steps.find-msi.outputs.MSI_FILENAME }}"
          $sig | Format-List Status, StatusMessage
          if ($sig.SignerCertificate) { $sig.SignerCertificate | Format-List Subject, Issuer, NotAfter }
          if ($sig.Status -ne 'Valid') {
            Write-Error "Authenticode signature status: $($sig.Status)"
            exit 1
          }
        shell: pwsh

      # Betas ship x64 AppImage + deb only, store-compressed — beta
      # arm64/rpm users ride their previous pointer until stable; the
      # linux arm64 beta leg never spawns (computed matrix). Stable
      # legs build their arch's three targets.
      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/desktop
        run: |
          if [ "${{ steps.detect_beta.outputs.is_beta }}" == "true" ]; then
            pnpm dist:linux:beta
          else
            pnpm dist:linux:${{ matrix.arch }}

            if [ $(find dist -name "*.rpm" -type f | wc -l) -eq 0 ]; then
              echo "::warning::RPM packages not found, trying explicit build..."
              pnpm dist:linux:rpm:${{ matrix.arch }}
            fi
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The mac oh/ohd pair used to ride this leg (10×-billed macOS
      # minutes made a second runner the pipeline's most expensive
      # overhead); that economics died with the move to free public
      # runners, so the pair lives in build-binaries' macos row again —
      # off this critical path.
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.msi
            apps/desktop/dist/*.pkg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/*.yml

  # Standalone `oh` and `ohd` (win32 is not a daemon target) ship on
  # STABLE tags only — betas carry no standalone binaries: the daemon
  # beta testers exercise is the desktop-embedded one, and the beta
  # versions manifest carries cli/daemon forward from the last stable
  # (release job). The macOS pair is a matrix row here like the others
  # — it once rode the desktop macos leg because macOS minutes billed
  # at 10×, but on free public runners the repeated setup costs
  # nothing and riding the desktop leg put it on the release's
  # critical path. Versions come from each app's own package.json (the
  # extension precedent) — the tag stays the desktop's version axis.
  # Runtime split: `oh` is bun-compiled, `ohd` stays Node SEA
  # — two toolchains, one leg, no cross-contamination.
  build-binaries:
    if: ${{ github.event_name != 'workflow_dispatch' && !contains(github.ref_name, '-ext') && !contains(github.ref_name, '-cli') && !contains(github.ref_name, '-daemon') && !contains(github.ref_name, '-beta') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so build stamps derived from commit counts
          # mean something on release binaries.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Insurance law: the CLI source stays
      # runtime-neutral, proven by running its unit suite under bun on
      # every stable release; the regular CI lane runs it under Node.
      - name: Run CLI unit suite under bun
        working-directory: apps/cli
        run: bun --bun vitest run
        shell: bash

      # pack:bun compiles src straight to a self-contained binary
      # (minified, JSC bytecode) and verifies the binary's contract
      # before anything ships.
      - name: Build and verify oh bun binary
        run: pnpm --filter @openheaders/cli run pack:bun
        shell: bash

      # Same eSigner path as the desktop leg: the downloaded CLI exe
      # trips SmartScreen unsigned, and `install-oh.ps1` fails under
      # AllSigned execution policies. Deterministic pre-stage paths, so
      # no find step; missing secrets degrade to unsigned (the job
      # itself is stable-only).
      - name: Check Windows signing credentials
        if: matrix.os == 'windows-2022'
        id: win_sign
        run: |
          if [ -n "$ES_USERNAME" ] && [ -n "$ES_PASSWORD" ] && [ -n "$CREDENTIAL_ID" ] && [ -n "$ES_TOTP_SECRET" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::notice::Windows signing secrets not configured - publishing unsigned oh.exe"
          fi
        shell: bash
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}

      - name: Sign oh CLI executable
        if: matrix.os == 'windows-2022' && steps.win_sign.outputs.enabled == 'true'
        uses: sslcom/esigner-codesign@a272724cb13abe0abc579c6c40f7899969b6942b # v1.3.1
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: apps/cli/dist-bun/oh.exe
          malware_block: true
          override: true
          environment_name: PROD
          clean_logs: false
          jvm_max_memory: 1024M
          signing_method: v1

      - name: Sign Windows install script
        if: matrix.os == 'windows-2022' && steps.win_sign.outputs.enabled == 'true'
        uses: sslcom/esigner-codesign@a272724cb13abe0abc579c6c40f7899969b6942b # v1.3.1
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: apps/cli/scripts/install.ps1
          malware_block: true
          override: true
          environment_name: PROD
          clean_logs: false
          jvm_max_memory: 1024M
          signing_method: v1

      # The signed exe must still answer — a signature that breaks the
      # binary is worse than no signature.
      - name: Verify CLI signatures
        if: matrix.os == 'windows-2022' && steps.win_sign.outputs.enabled == 'true'
        run: |
          foreach ($f in @("apps/cli/dist-bun/oh.exe", "apps/cli/scripts/install.ps1")) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f -> $($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              Write-Error "Authenticode signature status for ${f}: $($sig.Status)"
              exit 1
            }
          }
          & "apps/cli/dist-bun/oh.exe" --version
          if ($LASTEXITCODE -ne 0) { Write-Error "signed oh.exe no longer runs"; exit 1 }
        shell: pwsh

      # The ohd SEA payload embeds the platform's HTTP/3 helper — this
      # leg has its own checkout, so it builds its own (host target).
      - name: Cache cargo (HTTP/3 helper)
        if: matrix.os != 'windows-2022'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/h3-helper/target
          key: ${{ runner.os }}-h3-helper-${{ hashFiles('native/h3-helper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-h3-helper-

      - name: Build HTTP/3 helper
        if: matrix.os != 'windows-2022'
        run: node scripts/build-h3-helper.mjs
        shell: bash

      # The daemon binary embeds the built web app when present.
      - name: Build and verify ohd SEA binary
        if: matrix.os != 'windows-2022'
        run: |
          pnpm turbo build --filter=@openheaders/daemon --filter=@openheaders/web
          pnpm --filter @openheaders/daemon run pack:sea
        shell: bash

      - name: Setup macOS code signing
        if: matrix.os == 'macos-latest'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      # The pack scripts leave ad-hoc/unsigned binaries; re-sign with
      # Developer ID (hardened runtime + timestamp, required for
      # notarization), then notarize both binaries in one submission.
      # Flat binaries can't be stapled — Gatekeeper resolves the ticket
      # from Apple's servers on first quarantined run.
      - name: Sign and notarize binaries (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in the keychain"
            exit 1
          fi
          mkdir -p notarize-stage
          # Hardened runtime without the JIT entitlements SIGTRAPs the
          # JS engine on user machines — V8 for the Node SEA `ohd`, JSC
          # for the bun-compiled `oh` (the runner's own probe does not
          # enforce them).
          for BINARY in apps/cli/dist-bun/oh apps/daemon/dist-sea/ohd; do
            codesign --force --sign "$IDENTITY" --options runtime --timestamp \
              --entitlements .github/sea-entitlements.plist "$BINARY"
            codesign --verify --strict "$BINARY"
            codesign -d --entitlements - "$BINARY" 2>&1 | grep -q allow-jit
            # The signed binary must still answer
            "$BINARY" --version
            cp "$BINARY" notarize-stage/
          done
          ditto -c -k notarize-stage notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # The container is the same verified SEA binary in an LTS base;
      # the probe re-runs boot + /healthz inside it before anything is
      # pushed (glibc drift between runner and base would surface here).
      # ghcr is a recoverable channel like GitHub Releases, so it rides
      # the pipeline (the job itself is stable-only, so the image and
      # :latest always move together).
      - name: Build and push ohd Docker image
        if: matrix.os == 'ubuntu-latest' && github.repository_owner == 'OpenHeaders'
        run: |
          OHD_VERSION=$(node -p "require('./apps/daemon/package.json').version")
          IMAGE=ghcr.io/openheaders/ohd

          docker build --build-arg OHD_VERSION="$OHD_VERSION" -t "$IMAGE:$OHD_VERSION" apps/daemon
          docker run --rm "$IMAGE:$OHD_VERSION" --version

          CONTAINER=$(docker run -d -p 18637:8137 "$IMAGE:$OHD_VERSION")
          HEALTHY=""
          for _ in $(seq 1 60); do
            if curl -fs http://127.0.0.1:18637/healthz > /dev/null; then
              HEALTHY=1
              break
            fi
            sleep 1
          done
          if [ -z "$HEALTHY" ]; then
            docker logs "$CONTAINER"
            echo "::error::ohd container never answered /healthz"
            exit 1
          fi
          docker rm -f "$CONTAINER"

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$OHD_VERSION"
          docker tag "$IMAGE:$OHD_VERSION" "$IMAGE:latest"
          docker push "$IMAGE:latest"
        shell: bash

      - name: Stage binary assets
        run: |
          mkdir -p release-binaries
          OH_VERSION=$(node -p "require('./apps/cli/package.json').version")
          case "${{ matrix.os }}" in
            macos-latest) OS_ARCH=mac-arm64 ;;
            ubuntu-latest) OS_ARCH=linux-x64 ;;
            windows-2022) OS_ARCH=win-x64 ;;
          esac
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp apps/cli/dist-bun/oh.exe "release-binaries/oh-${OH_VERSION}-${OS_ARCH}.exe"
            # Travels via artifact so the release job stages the signed
            # copy instead of the plain one from its own checkout.
            cp apps/cli/scripts/install.ps1 release-binaries/install-oh.ps1
          else
            OHD_VERSION=$(node -p "require('./apps/daemon/package.json').version")
            cp apps/cli/dist-bun/oh "release-binaries/oh-${OH_VERSION}-${OS_ARCH}"
            cp apps/daemon/dist-sea/ohd "release-binaries/ohd-${OHD_VERSION}-${OS_ARCH}"
          fi
          # One leg generates the aggregated license texts for the
          # bundled JS closure — identical across platforms, ships as
          # a release asset beside the binaries.
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            node scripts/generate-third-party-notices.mjs --out release-binaries/THIRD-PARTY-NOTICES-oh-ohd.txt apps/cli apps/daemon
          fi
        shell: bash

      - name: Upload binary artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.os }}
          path: release-binaries/*

  # No extension leg: extension distribution is store-listings only
  # (stable AND beta) — releases carry no extension zips. The release
  # body still links the stores; the extension version is read from
  # apps/extension/package.json.

  release:
    # Runs as long as the workflow wasn't cancelled — a failed OS leg
    # still yields a release from the legs that produced artifacts.
    if: ${{ github.event_name != 'workflow_dispatch' && !contains(github.ref_name, '-ext') && !contains(github.ref_name, '-cli') && !contains(github.ref_name, '-daemon') && !cancelled() && needs.build-desktop.result != 'cancelled' }}
    needs: [build-desktop, build-binaries]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine release type
        id: release_type
        run: |
          TAG_NAME=${GITHUB_REF_NAME}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          if [[ "$TAG_NAME" =~ -beta[.0-9]*$ ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      # Canonical-form gate for every changelog projection below —
      # asset-budget overruns warn, form violations fail the release
      # before anything is published.
      - name: Lint changelog tree
        run: node scripts/lint-changelog.mjs

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      # Store listings serve the extension (stable only — it has no
      # beta channel), so the body's store table renders on stable only.
      - name: Read extension version
        id: ext_ver
        if: steps.release_type.outputs.is_prerelease == 'false'
        run: |
          EXT_VERSION=$(node -p "require('./apps/extension/package.json').version")
          echo "version=$EXT_VERSION" >> $GITHUB_OUTPUT
          echo "Extension version: $EXT_VERSION"

      # Secrets are not readable in step `if:` expressions; missing R2
      # credentials degrade to GitHub-hosted downloads instead of
      # failing the release.
      - name: Check R2 credentials
        id: r2
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::R2 secrets not configured — feed not updated, downloads served from GitHub"
          fi
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # The single authority for where downloads live. With R2, every
      # printed and machine-read download URL is an own-domain form
      # — corporate networks only ever need
      # openheaders.com reachable. Artifacts also land on the GitHub
      # release page as a human-browsable redundant copy.
      - name: Determine download base
        id: dl_base
        run: |
          if [ "${{ steps.r2.outputs.enabled }}" = "true" ]; then
            echo "url=https://updates.openheaders.com/dl/${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "url=https://github.com/${RELEASE_REPO}/releases/download/${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Process artifacts for release
        run: |
          mkdir -p processed_files
          VERSION=${GITHUB_REF_NAME/v/}

          # Desktop artifacts. electron-builder names the update-info
          # files after the version's channel (latest*.yml on stable,
          # beta*.yml on prerelease) — copy both shapes; the feed
          # generator normalizes them. builder-debug.yml stays behind.
          if [ -d "dist/desktop-windows-2022" ]; then
            cp dist/desktop-windows-2022/*.exe processed_files/ 2>/dev/null || true
            cp dist/desktop-windows-2022/*.msi processed_files/ 2>/dev/null || true
            cp dist/desktop-windows-2022/*.blockmap processed_files/ 2>/dev/null || true
            cp dist/desktop-windows-2022/latest.yml processed_files/ 2>/dev/null || true
            cp dist/desktop-windows-2022/beta.yml processed_files/ 2>/dev/null || true
          fi

          # macOS and Linux build as one leg per arch — walk every arch
          # directory. The mac update-info files are handled by the
          # merge below, not copied here.
          for d in dist/desktop-macos-latest-*; do
            [ -d "$d" ] || continue
            cp "$d"/*.dmg processed_files/ 2>/dev/null || true
            cp "$d"/*.pkg processed_files/ 2>/dev/null || true
            cp "$d"/*.zip processed_files/ 2>/dev/null || true
            cp "$d"/*.blockmap processed_files/ 2>/dev/null || true
          done

          # Two mac legs write two one-arch update-info files; the feed
          # serves ONE latest-mac.yml, so union their files lists. A
          # single input (the arm64-only beta lane, or a failed leg)
          # passes through unchanged; a merge conflict fails the
          # release before any pointer is published.
          for NAME in latest-mac.yml beta-mac.yml; do
            MAC_YMLS=$(find dist -path "dist/desktop-macos-latest-*" -name "$NAME" | sort)
            if [ -n "$MAC_YMLS" ]; then
              node scripts/merge-mac-update-yml.mjs "processed_files/$NAME" $MAC_YMLS
            fi
          done

          # The linux update-info files are per-arch NAMED
          # (latest-linux.yml x64, latest-linux-arm64.yml arm64), so
          # each leg's copy lands beside the other — no merge.
          for d in dist/desktop-ubuntu-latest-*; do
            [ -d "$d" ] || continue
            cp "$d"/*.AppImage processed_files/ 2>/dev/null || true
            cp "$d"/*.deb processed_files/ 2>/dev/null || true
            find "$d" -name "*.rpm" -exec cp {} processed_files/ \; 2>/dev/null || true
            cp "$d"/latest-linux.yml processed_files/ 2>/dev/null || true
            cp "$d"/latest-linux-arm64.yml processed_files/ 2>/dev/null || true
            cp "$d"/beta-linux.yml processed_files/ 2>/dev/null || true
            cp "$d"/beta-linux-arm64.yml processed_files/ 2>/dev/null || true
          done

          # Standalone oh/ohd binaries + one checksums file over them
          find dist -path 'dist/binaries-*' -type f -exec cp {} processed_files/ \;
          BINS=$(cd processed_files && ls oh-* ohd-* 2>/dev/null || true)
          if [ -n "$BINS" ]; then
            (cd processed_files && shasum -a 256 $BINS > SHA256SUMS.txt)
            # Installer scripts ride every release so the stable
            # /releases/latest/download one-liners always resolve. The
            # ps1 prefers the windows-leg artifact copy — that one is
            # Authenticode-signed on stable.
            cp apps/cli/scripts/install.sh processed_files/install-oh.sh
            [ -f processed_files/install-oh.ps1 ] || cp apps/cli/scripts/install.ps1 processed_files/install-oh.ps1
          fi

          echo "Files prepared for release:"
          ls -la processed_files/
        shell: bash

      # Detached GPG signature over the checksums manifest — a trust
      # root beyond TLS for the standalone binaries. Missing key means
      # the manifest ships unsigned instead of failing the release.
      - name: Sign checksums manifest
        run: |
          if [ ! -f processed_files/SHA256SUMS.txt ]; then
            exit 0
          fi
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::notice::GPG_PRIVATE_KEY not configured - SHA256SUMS.txt ships unsigned"
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign \
            --output processed_files/SHA256SUMS.txt.asc processed_files/SHA256SUMS.txt
          gpg --verify processed_files/SHA256SUMS.txt.asc processed_files/SHA256SUMS.txt
          # The public key rides along so a release is verifiable on its
          # own; the canonical fingerprint cross-check lives at
          # https://openheaders.com/gpg and SECURITY.md.
          gpg --batch --armor --export security@openheaders.io \
            > processed_files/openheaders-release-key.asc
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # versions.json — the static severity manifest. Clients fetch it
      # anonymously from the update feed at versions/<channel>.json;
      # the release-page copy is redundant. Severity is authored in
      # .github/release-severity.json before tagging, never inferred.
      - name: Generate versions manifest
        run: |
          node scripts/generate-versions-manifest.mjs "$GITHUB_REF_NAME" > processed_files/versions.json
          cat processed_files/versions.json

      # The store cron (check-store-versions.yml) keeps `extension.stores`
      # live on the channel manifest; the generator builds fresh and would
      # drop it until the next cron run. Carry the live object forward —
      # fail-open: no live manifest or no stores means nothing to carry.
      # Betas additionally carry cli/daemon whole, from the live STABLE
      # manifest: beta tags stage no standalone binaries, so those
      # entries must name the newest tag whose release page actually
      # hosts them — always a stable one. The CLI's update check and
      # the website's install one-liners build download URLs from
      # `tag`, and carrying from the beta manifest would freeze them at
      # the last binary-bearing beta forever.
      - name: Carry forward live manifest entries
        run: |
          CHANNEL=stable
          if [ "${{ steps.release_type.outputs.is_prerelease }}" = "true" ]; then CHANNEL=beta; fi
          # Stores carry on stable only — the beta manifest carries no
          # extension entry at all (stores are the extension's only
          # channel; no sideload zips exist on any channel).
          if [ "$CHANNEL" = "stable" ]; then
            if curl -fsS --max-time 30 "https://updates.openheaders.com/versions/stable.json" -o live_versions.json; then
              STORES=$(jq -c '.extension.stores // empty' live_versions.json)
              if [ -n "$STORES" ]; then
                node scripts/patch-versions-entry.mjs processed_files/versions.json extension \
                  "{\"stores\":${STORES}}" > versions_with_stores.json
                mv versions_with_stores.json processed_files/versions.json
                echo "Carried extension.stores: ${STORES}"
              else
                echo "Live stable manifest has no extension.stores — nothing to carry"
              fi
            else
              echo "No live stable manifest — nothing to carry"
            fi
          fi
          if [ "$CHANNEL" = "beta" ]; then
            if curl -fsS --max-time 30 "https://updates.openheaders.com/versions/stable.json" -o live_stable.json; then
              for APP in cli daemon; do
                ENTRY=$(jq -c ".${APP} // empty" live_stable.json)
                if [ -n "$ENTRY" ]; then
                  node scripts/patch-versions-entry.mjs processed_files/versions.json "$APP" \
                    "$ENTRY" > versions_patched.json
                  mv versions_patched.json processed_files/versions.json
                  echo "Carried ${APP} entry from stable: ${ENTRY}"
                else
                  echo "Live stable manifest has no ${APP} entry — nothing to carry"
                fi
              done
            else
              echo "No live stable manifest — cli/daemon entries not carried"
            fi
          fi
          cat processed_files/versions.json

      - name: Generate Release Body
        run: |
          VERSION=${GITHUB_REF_NAME/v/}
          EXT_VERSION="${{ steps.ext_ver.outputs.version }}"
          IS_PRERELEASE="${{ steps.release_type.outputs.is_prerelease }}"
          REPO="$RELEASE_REPO"

          DL="${{ steps.dl_base.outputs.url }}"
          ICONS="https://raw.githubusercontent.com/${REPO}/main/docs/assets"
          SUMS_LINE="Checksums: [SHA256SUMS.txt](${DL}/SHA256SUMS.txt)"
          if [ -f processed_files/SHA256SUMS.txt.asc ]; then
            SUMS_LINE="${SUMS_LINE} · [GPG signature](${DL}/SHA256SUMS.txt.asc) · [signing key](https://openheaders.com/gpg)"
          fi

          {
            echo "<p align=\"center\"><img src=\"${ICONS}/logo.svg\" width=\"88\" alt=\"Open Headers\"></p>"
            echo ""
          } > release_body.md

          if [ "$IS_PRERELEASE" = "true" ]; then
            echo '> **This is a beta build for early testing.** It may contain bugs.' >> release_body.md
            echo '' >> release_body.md
          fi

          # Brand icons live in this repo's docs/assets/ directory —
          # markdown img tags are the only way GitHub renders svg in a
          # release body.
          icon() { echo "<img src=\"${ICONS}/$1.svg\" width=\"16\" align=\"center\">"; }
          I_MAC=$(icon macos)
          I_WIN=$(icon windows)
          I_LINUX=$(icon linux)
          I_DEBIAN=$(icon debian)
          I_FEDORA=$(icon fedora)
          I_CHROME=$(icon chrome)
          I_FIREFOX=$(icon firefox)
          I_EDGE=$(icon edge)
          I_DOCKER=$(icon docker)

          # Tables lead, prose collapses into <details> — the reader is
          # here for download links. Betas build no pkg/msi/mac-x64, so
          # those rows/blocks only render on stable. No section title
          # carries a version: the desktop version IS the release tag,
          # and the independently-versioned surfaces (extension, oh,
          # ohd) show theirs in asset filenames / store pages.
          {
            echo "## Desktop App"
            echo ""
            echo "| Platform | Downloads |"
            echo "| --- | --- |"
            # Betas build a trimmed target set (mac arm64 dmg/zip; Linux
            # x64 AppImage/deb; no rpm) — the table only links what the
            # legs actually shipped.
            if [ "$IS_PRERELEASE" = "true" ]; then
              echo "| ${I_MAC} macOS | [Apple Silicon (DMG)](${DL}/OpenHeaders-${VERSION}-mac-arm64.dmg) |"
              echo "| ${I_WIN} Windows | [Installer (EXE)](${DL}/OpenHeaders-${VERSION}-Setup.exe) |"
              echo "| ${I_LINUX} Linux | [AppImage x64](${DL}/OpenHeaders-${VERSION}-x86_64.AppImage) |"
              echo "| ${I_DEBIAN} Debian / Ubuntu | [x64 (deb)](${DL}/open-headers_${VERSION}_amd64.deb) |"
            else
              echo "| ${I_MAC} macOS | [Apple Silicon (DMG)](${DL}/OpenHeaders-${VERSION}-mac-arm64.dmg) · [Intel (DMG)](${DL}/OpenHeaders-${VERSION}-mac-x64.dmg) |"
              echo "| ${I_WIN} Windows | [Installer (EXE)](${DL}/OpenHeaders-${VERSION}-Setup.exe) |"
              echo "| ${I_LINUX} Linux | [AppImage x64](${DL}/OpenHeaders-${VERSION}-x86_64.AppImage) · [AppImage ARM64](${DL}/OpenHeaders-${VERSION}-arm64.AppImage) |"
              echo "| ${I_DEBIAN} Debian / Ubuntu | [x64 (deb)](${DL}/open-headers_${VERSION}_amd64.deb) · [ARM64 (deb)](${DL}/open-headers_${VERSION}_arm64.deb) |"
              echo "| ${I_FEDORA} Fedora / RHEL | [x64 (rpm)](${DL}/open-headers-${VERSION}.x86_64.rpm) · [ARM64 (rpm)](${DL}/open-headers-${VERSION}.aarch64.rpm) |"
            fi
            if [ "$IS_PRERELEASE" != "true" ]; then
              echo ""
              echo "<details><summary><b>Enterprise - Managed deployment (MDM / GPO)</b></summary>"
              echo ""
              echo "| Platform | Downloads |"
              echo "| --- | --- |"
              echo "| ${I_MAC} macOS | [PKG Apple Silicon](${DL}/OpenHeaders-${VERSION}-mac-arm64.pkg) · [PKG Intel](${DL}/OpenHeaders-${VERSION}-mac-x64.pkg) |"
              echo "| ${I_WIN} Windows | [MSI](${DL}/OpenHeaders-${VERSION}.msi) |"
              echo ""
              echo "macOS PKGs are signed and notarized; the Windows MSI is Authenticode-signed."
              echo ""
              echo "</details>"
            fi
          } >> release_body.md

          if [ -n "$EXT_VERSION" ]; then
            STORE_CHROME="https://chromewebstore.google.com/detail/ablaikadpbfblkmhpmbbnbbfjoibeejb"
            STORE_FIREFOX="https://addons.mozilla.org/en-US/firefox/addon/open-headers/"
            STORE_EDGE="https://microsoftedge.microsoft.com/addons/detail/open-headers/gnbibobkkddlflknjkgcmokdlpddegpo"
            {
              echo ""
              echo "## Browser Extension"
              echo ""
              echo "| Browser | Store |"
              echo "| --- | --- |"
              echo "| ${I_CHROME} Chrome | [Chrome Web Store](${STORE_CHROME}) |"
              echo "| ${I_FIREFOX} Firefox | [Firefox Add-ons](${STORE_FIREFOX}) |"
              echo "| ${I_EDGE} Edge | [Edge Add-ons](${STORE_EDGE}) |"
            } >> release_body.md
          fi

          # oh/ohd binaries carry their own app versions — list what
          # the legs actually staged, one section per product surface.
          BIN_FILES=$(cd processed_files && ls oh-* ohd-* 2>/dev/null || true)
          OH_FILES=$(echo "$BIN_FILES" | tr ' ' '\n' | grep '^oh-' || true)
          OHD_FILES=$(echo "$BIN_FILES" | tr ' ' '\n' | grep '^ohd-' || true)

          bin_row() {
            case "$1" in
              *-mac-arm64) PLATFORM="${I_MAC} macOS (Apple Silicon)" ;;
              *-mac-x64) PLATFORM="${I_MAC} macOS (Intel)" ;;
              *-linux-x64) PLATFORM="${I_LINUX} Linux (x64)" ;;
              *-linux-arm64) PLATFORM="${I_LINUX} Linux (ARM64)" ;;
              *-win-x64.exe) PLATFORM="${I_WIN} Windows (x64)" ;;
              *) PLATFORM="$1" ;;
            esac
            echo "| ${PLATFORM} | [$1](${DL}/$1) |"
          }

          if [ -n "$OH_FILES" ]; then
            {
              echo ""
              echo "## Terminal - CLI & TUI"
              echo ""
              echo "| Platform | Download |"
              echo "| --- | --- |"
              for f in $OH_FILES; do bin_row "$f"; done
              echo ""
              echo "${SUMS_LINE}"
              echo ""
              echo "<details><summary><b>Install scripts & notes</b></summary>"
              echo ""
              echo "Install script (verifies checksums, installs \`oh\` to \`~/.local/bin\`):"
              echo ""
              echo '```sh'
              echo "curl -fsSL https://updates.openheaders.com/install.sh | sh"
              echo '```'
              echo ""
              echo "Windows (PowerShell):"
              echo ""
              echo '```powershell'
              echo "irm https://updates.openheaders.com/install.ps1 | iex"
              echo '```'
              echo ""
              echo "No Node.js required (\`npm install -g @openheaders/cli\` is the Node channel). macOS binaries are signed and notarized; the Windows \`oh\` is Authenticode-signed. Script copies on this page: [install-oh.sh](${DL}/install-oh.sh) · [install-oh.ps1](${DL}/install-oh.ps1)"
              echo ""
              echo "</details>"
            } >> release_body.md
          fi

          if [ -n "$OHD_FILES" ]; then
            OHD_DOCKER_VERSION=$(echo "$OHD_FILES" | sed -n 's/^ohd-\([0-9][^ ]*\)-linux-x64$/\1/p' | head -1)
            {
              echo ""
              echo "## Team - Server Daemon"
              echo ""
              echo "| Platform | Download |"
              echo "| --- | --- |"
              for f in $OHD_FILES; do bin_row "$f"; done
              if [ -n "$OHD_DOCKER_VERSION" ]; then
                echo "| ${I_DOCKER} Docker | \`ghcr.io/openheaders/ohd:${OHD_DOCKER_VERSION}\` |"
              fi
              echo ""
              echo "${SUMS_LINE}"
              echo ""
              echo "<details><summary><b>Install scripts & notes</b></summary>"
              echo ""
              echo "Install script (verifies checksums, installs \`oh\` + \`ohd\` to \`~/.local/bin\`):"
              echo ""
              echo '```sh'
              echo "curl -fsSL https://updates.openheaders.com/install.sh | sh -s -- --with-daemon"
              echo '```'
              if [ -n "$OHD_DOCKER_VERSION" ]; then
                echo ""
                echo "Docker:"
                echo ""
                echo '```sh'
                echo "docker run -d -p 127.0.0.1:8137:8137 -v oh-data:/data ghcr.io/openheaders/ohd:${OHD_DOCKER_VERSION}"
                echo '```'
              fi
              echo ""
              echo "</details>"
            } >> release_body.md
          fi

      # The canonical entry's body rides the release page too
      # (the changelog plan §4.2) — appended after the download tables so
      # the Releases tab reads as a full changelog with no extra
      # authoring. Stubs and missing entries append nothing.
      - name: Append changelog entry to release body
        run: |
          VERSION_BASE=$(echo "${GITHUB_REF_NAME/v/}" | sed 's/-beta\.[0-9]*$//')
          node scripts/changelog-entry-body.mjs desktop "$VERSION_BASE" > entry_body.md
          if [ -s entry_body.md ]; then
            { echo ""; echo "---"; echo ""; echo "## What's New"; echo ""; cat entry_body.md; } >> release_body.md
            echo "Appended desktop ${VERSION_BASE} entry to the release body"
          else
            echo "No prose entry for desktop ${VERSION_BASE} — release body unchanged"
          fi

      # Release bytes live on the feed bucket under an immutable
      # per-tag path — Cloudflare's edge caches them (a zone Cache Rule
      # keys /dl/* without query strings), R2 egress is free, and
      # corporate networks never need github.com. Uploaded BEFORE the
      # release and the pointer files exist, so no published URL can
      # name missing bytes. Pointer/channel files are excluded — their
      # home is desktop/<channel>/ and versions/.
      - name: Upload release artifacts to R2
        if: steps.r2.outputs.enabled == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          find processed_files -maxdepth 1 -type f \
            ! -name 'latest*.yml' ! -name 'beta*.yml' ! -name 'versions.json' | while read -r file; do
            NAME="$(basename "$file")"
            case "$NAME" in
              *.txt) TYPE="text/plain; charset=utf-8" ;;
              *.asc) TYPE="text/plain; charset=utf-8" ;;
              *.sh) TYPE="text/x-shellscript; charset=utf-8" ;;
              *.ps1) TYPE="text/plain; charset=utf-8" ;;
              *.zip) TYPE="application/zip" ;;
              *) TYPE="application/octet-stream" ;;
            esac
            # Per-tag paths never change — cache as immutable.
            aws s3 cp "$file" "s3://${R2_BUCKET}/dl/${GITHUB_REF_NAME}/${NAME}" \
              --endpoint-url "$ENDPOINT" --region auto \
              --content-type "$TYPE" \
              --cache-control "public, max-age=31536000, immutable" \
              --no-progress
          done

      # The GitHub release page stays the human-browsable home and a
      # redundant copy of every artifact — machine contracts point at
      # the feed.
      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: "${{ github.ref_name }}"
          draft: false
          prerelease: ${{ steps.release_type.outputs.is_prerelease == 'true' }}
          name: "${{ github.ref_name }}"
          files: processed_files/*
          fail_on_unmatched_files: false
          body_path: release_body.md
          generate_release_notes: false
          append_body: true

      # The update feed: static pointer files on R2 behind
      # updates.openheaders.com. The yml/json
      # pointers carry absolute URLs to this release's artifacts (the
      # feed's own dl/ path, or the GitHub assets when R2 is off), so
      # staging happens only after the bytes exist. A beta tag stages
      # only beta/ paths — stable pointers can never move.
      - name: Stage update feed pointers
        run: |
          node scripts/generate-update-feed.mjs "$GITHUB_REF_NAME" \
            "${{ steps.dl_base.outputs.url }}" \
            processed_files feed

      # The signed apt repository (the distribution plan §8, Phase 7):
      # pool + dists staged into the same tree the pointer upload
      # walks, indexes signed in-lane with the DEDICATED archive key —
      # never the release GPG key. Missing key secrets or missing deb
      # artifacts degrade to "apt tree unchanged" instead of failing
      # the release; a key that does not match the committed keyring
      # fails hard (the deb postinst pins that keyring).
      - name: Stage apt repository
        run: |
          node scripts/generate-apt-repo.mjs "$GITHUB_REF_NAME" processed_files feed
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}

      # The signed rpm/dnf repository — the second Linux leg, same
      # posture as apt: staged into the same tree, repomd.xml signed
      # in-lane with the same DEDICATED archive key, missing secrets or
      # missing rpm artifacts degrade to "rpm tree unchanged".
      # createrepo_c reads the rpm headers and writes repodata/.
      - name: Stage rpm repository
        run: |
          sudo apt-get update && sudo apt-get install -y createrepo-c
          node scripts/generate-rpm-repo.mjs "$GITHUB_REF_NAME" processed_files feed
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}

      # Changelog feed objects (the changelog plan §4.1) stage into the
      # same tree the pointer upload walks. The previously published
      # index is merged in fail-open — it may carry rows for entry-less
      # releases the canonical tree never records.
      - name: Stage changelog feed objects
        run: |
          curl -fsS --max-time 30 "https://updates.openheaders.com/changelog/index.json" -o prior_index.json \
            || rm -f prior_index.json
          if [ -f prior_index.json ]; then
            node scripts/generate-changelog-feed.mjs "$GITHUB_REF_NAME" feed prior_index.json
          else
            echo "No live changelog index — generating from the tree alone"
            node scripts/generate-changelog-feed.mjs "$GITHUB_REF_NAME" feed
          fi
          find feed -type f | sort

      - name: Upload update feed to R2
        if: steps.r2.outputs.enabled == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          # aws-cli ≥ 2.23 defaults to CRC32 request checksums, which
          # R2's S3 layer rejects.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          find feed -type f | while read -r file; do
            KEY="${file#feed/}"
            case "$file" in
              *.yml)  TYPE="text/yaml" ;;
              *.json) TYPE="application/json" ;;
              *.md)   TYPE="text/markdown; charset=utf-8" ;;
              *.ps1)  TYPE="text/plain; charset=utf-8" ;;
              *.txt)  TYPE="text/plain; charset=utf-8" ;;
              *.sh)   TYPE="text/x-shellscript; charset=utf-8" ;;
              *.asc)  TYPE="text/plain; charset=utf-8" ;;
              *.webp) TYPE="image/webp" ;;
              *.png)  TYPE="image/png" ;;
              *.deb)  TYPE="application/vnd.debian.binary-package" ;;
              *.rpm)  TYPE="application/x-rpm" ;;
              *.xml)  TYPE="text/xml; charset=utf-8" ;;
              *.gz)   TYPE="application/gzip" ;;
              *.gpg)  TYPE="application/pgp-signature" ;;
              */Release|*/InRelease|*/Packages) TYPE="text/plain; charset=utf-8" ;;
              *)      TYPE="application/octet-stream" ;;
            esac
            # Short cache so a fresh release is visible within minutes
            # of the pointer upload — clients check at most daily.
            # Changelog assets, per-beta snapshots, apt pool debs, rpm
            # pool rpms, and the hash-prefixed repodata indexes never
            # change once shipped — those cache as immutable. repomd.xml
            # (and its signature) is the one mutable rpm index name, so
            # it stays on the short-cache default.
            case "$KEY" in
              rpm/*/repodata/repomd.xml*)
                CACHE="public, max-age=300, must-revalidate" ;;
              changelog/assets/*|changelog/*-beta.*.json|apt/*/pool/*|rpm/*/Packages/*|rpm/*/repodata/*)
                CACHE="public, max-age=31536000, immutable" ;;
              *)
                CACHE="public, max-age=300, must-revalidate" ;;
            esac
            aws s3 cp "$file" "s3://${R2_BUCKET}/${KEY}" \
              --endpoint-url "$ENDPOINT" --region auto \
              --content-type "$TYPE" \
              --cache-control "$CACHE" \
              --no-progress
          done


