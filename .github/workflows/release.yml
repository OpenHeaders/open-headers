name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry run: manual dispatch builds desktop legs with the full stable
  # signing path (the unpacked tree signed → installers packaged and
  # signed by the builder → signature checks) and uploads the
  # artifacts — no binaries leg, no release job, nothing published.
  # `windows` builds the two Windows arches only (the signing dry run);
  # `all` builds every desktop leg.
  workflow_dispatch:
    inputs:
      legs:
        description: Desktop legs to build
        type: choice
        options:
          - windows
          - all
        default: windows

# Least privilege per job: the build legs only read the checkout; the
# binaries leg pushes the ohd image to ghcr; the release job writes the
# release and moves the ghcr pointer.
permissions:
  contents: read

# Two tag runs must never interleave their feed uploads (pointers are
# global per channel); they queue instead — a queued release is never
# cancelled, its bytes may already be on the feed.
concurrency:
  group: release-feed
  cancel-in-progress: false

# The vite production builds need more than the runners' ~2GB default
# Node heap.
env:
  NODE_OPTIONS: --max-old-space-size=4096
  # Where release artifacts land; the update feed's pointer files carry
  # absolute URLs into this repo's release pages.
  RELEASE_REPO: OpenHeaders/open-headers
  R2_BUCKET: oh-updates
  # Windows Authenticode signing rides Azure Artifact Signing. These
  # three are identifiers, not secrets — the credentials are the
  # AZURE_* secrets. Its certificates live a few days, so every signing
  # step timestamps: an untimestamped signature dies with its
  # certificate.
  WIN_SIGN_ENDPOINT: https://plc.codesigning.azure.net/
  WIN_SIGN_ACCOUNT: openheaders-signing
  WIN_SIGN_PROFILE: openheaders-public-trust
  # Log noise off: turbo's telemetry banner, the Visual Studio
  # telemetry orphan (vctip) on the Windows legs, needrestart's service
  # prompts after apt installs on the Linux legs.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  VSCMD_SKIP_SENDTELEMETRY: 1
  NEEDRESTART_SUSPEND: 1
  # Our own product telemetry off on every leg: the smoke runs of the
  # built `oh` would otherwise count as product sessions.
  OH_TELEMETRY: '0'

jobs:
  build-desktop:
    if: ${{ !contains(github.ref_name, '-ext') && !contains(github.ref_name, '-cli') && !contains(github.ref_name, '-daemon') }}
    runs-on: ${{ matrix.runner || matrix.os }}
    permissions:
      contents: read
    # 2026.9.0: 29 min on the mac legs with every cache cold.
    timeout-minutes: 60
    # Shipped-artifact hardening (terser passes, strip-testid runtime,
    # debug-console removal, license-chunk bytecode) — release pipeline
    # only, so local production builds and the e2e target stay
    # untouched. Job-level because the dist:* scripts rebuild via
    # predist: a step-level env on an earlier build step gets its
    # output silently overwritten by that rebuild.
    env:
      OH_DESKTOP_CHANNEL: release
    strategy:
      # One OS leg failing must not cancel the others — every leg
      # reports, so one run diagnoses every failure; the release job
      # itself runs only when all of them succeeded.
      fail-fast: false
      matrix:
        # One leg per OS and arch, each on a runner of ITS OWN arch: a
        # package holds things only the arch that built them can load
        # (the license chunk's bytecode is compiled by the leg's own
        # Electron; the native modules by its own compiler), and a leg
        # can only check its package loads on the arch it is for. `os`
        # is the leg's family — the step conditions and the artifact
        # name read it; `runner` is the image when the family's own
        # label is the other arch (Intel macOS, ARM Linux). The release
        # job merges the two one-arch latest-mac.yml files into the
        # single feed pointer (linux update-info files are per-arch
        # named already, no merge). Every tag on either channel builds
        # every leg; a dry run (workflow_dispatch) builds the Windows
        # one unless it asks for all. Windows ARM64 is the job below
        # this one, on the same steps.
        # windows-2022 (not -latest): windows-latest ships Visual Studio 2026,
        # which the node-gyp bundled with electron-builder cannot detect, so
        # the native-module rebuild fails. VS 2022 stays detectable here.
        include: ${{ github.event_name == 'workflow_dispatch' && inputs.legs != 'all' && fromJSON('[{"os":"windows-2022"}]') || fromJSON('[{"os":"macos-latest","arch":"arm64"},{"os":"macos-latest","arch":"x64","runner":"macos-26-intel"},{"os":"windows-2022"},{"os":"ubuntu-latest","arch":"x64"},{"os":"ubuntu-latest","arch":"arm64","runner":"ubuntu-24.04-arm"}]') }}

    # The steps are shared, whole or by name: the Windows ARM64 leg runs
    # all of them, the job that packages its installer picks the ones
    # it needs.
    steps: &desktop_leg_steps
      - &checkout_step
        name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - &pnpm_step
        name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - &node_step
        name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm

      - &setuptools_step
        name: Install Python setuptools (Windows)
        if: runner.os == 'Windows'
        run: pip install setuptools
        shell: bash

      # macos-latest ships Python 3.12+, which removed distutils; the
      # node-gyp bundled with electron-builder still imports it when
      # rebuilding native modules (node-pty). Put a 3.11 first in PATH.
      - name: Setup Python 3.11 for node-gyp (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # rpm is a stable-only target — betas build AppImage/deb only.
      - name: Install RPM tools (Linux)
        if: matrix.os == 'ubuntu-latest' && !contains(github.ref_name, '-beta')
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm librpm-dev
          rpm --version

      - name: Create Electron cache directories
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            mkdir -p ~/.cache/electron ~/.cache/electron-builder
          elif [ "$RUNNER_OS" == "macOS" ]; then
            mkdir -p ~/Library/Caches/electron ~/Library/Caches/electron-builder ~/.electron
          elif [ "$RUNNER_OS" == "Windows" ]; then
            mkdir -p ~/AppData/Local/electron/Cache ~/AppData/Local/electron-builder/Cache ~/.electron
          fi

      # Arch in the key: the per-arch legs of one OS run concurrently
      # and each caches only its own arch's downloads — a shared key
      # would race on save and leave the loser cold every release.
      - name: Cache Electron
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.electron
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-${{ matrix.arch || 'x64' }}-electron-cache-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch || 'x64' }}-electron-cache-

      - name: Prepare build directory
        run: |
          rm -rf apps/desktop/dist
          mkdir -p apps/desktop/dist
        shell: bash

      - &install_step
        name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Build core package
        run: pnpm --filter @openheaders/core build

      # The leg's name in the six-target matrix — the NM host and
      # HTTP/3 helper builds compile for it and the load check finds
      # the unpacked app by it.
      - name: Compute leg target
        id: leg_target
        run: |
          case "${{ matrix.os }}" in
            macos-latest) echo "target=mac-${{ matrix.arch }}" >> $GITHUB_OUTPUT ;;
            ubuntu-latest) echo "target=linux-${{ matrix.arch }}" >> $GITHUB_OUTPUT ;;
            windows-11-arm) echo "target=win-arm64" >> $GITHUB_OUTPUT ;;
            *) echo "target=win-x64" >> $GITHUB_OUTPUT ;;
          esac
        shell: bash

      # The NM host rides the app under resources/nm-host (extraResources)
      # — without this step the packaged app ships hostless and the
      # extension degrades to device-flow pairing. One binary per
      # leg, compiled for the leg's own target.
      - name: Setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # The Bun release CDN answered 504 for longer than the action's
      # own two retries (v2026.9.2, the Linux x64 leg): one more attempt
      # after a real pause, the upload-retry idiom.
      - name: Wait before Bun retry
        if: steps.setup_bun.outcome == 'failure'
        run: sleep 60
        shell: bash

      - name: Setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Build NM host binary
        run: pnpm --filter @openheaders/nm-host run pack:bun ${{ steps.leg_target.outputs.target }}
        shell: bash

      # The HTTP/3 helper rides the app under resources/h3-helper (the
      # afterPack per-arch copy) and the ohd SEA payload — without this
      # step the packaged app ships helperless and a '3' send fails
      # honestly. Each leg builds only its own target, which is its
      # runner's own.
      - name: Cache cargo (HTTP/3 helper)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/h3-helper/target
          key: ${{ runner.os }}-${{ matrix.arch || 'x64' }}-h3-helper-${{ hashFiles('native/h3-helper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch || 'x64' }}-h3-helper-

      - name: Build HTTP/3 helper
        run: node scripts/build-h3-helper.mjs "${{ steps.leg_target.outputs.target }}"
        shell: bash

      # No standalone desktop build here: every dist:* script rebuilds
      # through `predist` (2026.9.0 built each leg twice, 4–7.5 min
      # apiece, the first output fully overwritten). The single build
      # runs AFTER the version pin below, so a beta's -beta.N version
      # is the one electron-builder sees.
      - name: Setup macOS code signing
        if: matrix.os == 'macos-latest'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - &detect_beta_step
        name: Detect beta build
        id: detect_beta
        run: |
          if [[ "${{ github.ref_name }}" =~ -beta[.0-9]*$ ]]; then
            echo "is_beta=true" >> $GITHUB_OUTPUT
          else
            echo "is_beta=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # A dispatch dry-run has a branch ref, not a tag — the build uses
      # the version already in package.json.
      - &version_pin_step
        name: Verify desktop version matches tag
        if: github.event_name != 'workflow_dispatch'
        run: |
          TAG="${GITHUB_REF_NAME/v/}"
          PKG_VERSION=$(node -p "require('./apps/desktop/package.json').version")

          # Extract base version (strip -beta.N suffix)
          TAG_BASE=$(echo "$TAG" | sed 's/-beta\.[0-9]*$//')
          PKG_BASE=$(echo "$PKG_VERSION" | sed 's/-beta\.[0-9]*$//')

          if [ "$TAG_BASE" != "$PKG_BASE" ]; then
            echo "::error::Version mismatch! Tag base is $TAG_BASE but apps/desktop/package.json base is $PKG_BASE"
            echo "::error::Bump apps/desktop/package.json to $TAG_BASE and commit before tagging."
            exit 1
          fi

          echo "Desktop version verified: tag=$TAG, package.json=$PKG_VERSION (base: $TAG_BASE)"

          # Set the full tag version in package.json for the build
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('apps/desktop/package.json'));p.version='$TAG';fs.writeFileSync('apps/desktop/package.json',JSON.stringify(p,null,2)+'\n')"
        shell: bash

      # Betas build every arch the stable builds — the beta channel is
      # read by every platform, so a pointer a beta does not rewrite
      # would strand that platform on an old beta (or offer one whose
      # files it cannot use). The trim is on asset TYPES only: betas
      # skip the enterprise formats (pkg/msi); beta testers use
      # dmg/zip/Setup.exe. Compression stays normal — a store-compressed
      # zip is three times the stable's size and shares no blocks with
      # it, so every channel hop was a full download.
      - name: Build macOS
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop
        run: |
          if [ "${{ steps.detect_beta.outputs.is_beta }}" == "true" ]; then
            pnpm dist:mac:beta:${{ matrix.arch }}
          else
            pnpm dist:mac:${{ matrix.arch }}
          fi
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Secrets are not readable in step `if:` expressions, so surface
      # their presence as an output; missing credentials mean the
      # Setup.exe ships unsigned instead of failing the leg. Checked
      # before the build because the signed lane packages in two
      # phases (unpacked → sign the tree → installers).
      - &win_sign_check_step
        name: Check Windows signing credentials
        if: runner.os == 'Windows'
        id: win_sign
        run: |
          if [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::notice::Windows signing secrets not configured - publishing unsigned Setup.exe"
          fi
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # No signing credentials: one unsigned pass (betas still skip the
      # MSI).
      - name: Build Windows
        if: matrix.os == 'windows-2022' && steps.win_sign.outputs.enabled != 'true'
        working-directory: apps/desktop
        shell: bash
        run: |
          if [ "${{ steps.detect_beta.outputs.is_beta }}" == "true" ]; then
            pnpm dist:win:unsigned:beta
          else
            pnpm dist:win:unsigned
          fi

      # Signed lane, stable and beta alike: the installed binaries need
      # Authenticode too — the NM chain's host verification anchors on
      # the signed `oh-nm-host.exe`, and enterprise allow-listing wants
      # every file signed, not only `OpenHeaders.exe`. Build unpacked
      # first, sign the tree, then package the installers from it.
      # A beta is signed the same way so a stable install, whose
      # updater checks the signer, accepts it on a channel switch.
      - name: Build Windows unpacked (signed lane)
        if: matrix.os == 'windows-2022' && steps.win_sign.outputs.enabled == 'true'
        working-directory: apps/desktop
        shell: bash
        run: pnpm dist:win:unsigned:dir

      # The ARM leg stops at the unpacked tree: signing does not run on
      # ARM runners, so the x64 job below it signs the tree and packages
      # the installer from it. Without
      # signing credentials the tree is built for an unsigned installer
      # (its packed app-update.yml carries no publisherName).
      - name: Build Windows ARM64 unpacked
        if: matrix.os == 'windows-11-arm'
        working-directory: apps/desktop
        shell: bash
        run: pnpm dist:win:unsigned:dir:arm64
        env:
          OH_WIN_SETUP_UNSIGNED: ${{ steps.win_sign.outputs.enabled != 'true' && '1' || '' }}

      # Every PE file in the unpacked tree that carries no signature is
      # signed here — the executables, the native addons, the runtime's
      # own libraries; a file its vendor signed keeps that signature.
      # The folder is read by the leg's arch (`win-unpacked`,
      # `win-arm64-unpacked`): the x64 leg runs this on the tree it
      # built, the ARM packaging job on the tree the ARM leg handed over.
      - &sign_tree_step
        name: Sign the unpacked tree
        if: matrix.os == 'windows-2022' && steps.win_sign.outputs.enabled == 'true'
        working-directory: apps/desktop
        shell: bash
        run: node scripts/build/sign-windows.js "dist/win${{ matrix.arch == 'arm64' && '-arm64' || '' }}-unpacked"
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # The installer and the uninstaller unpack plugin libraries from
      # the builder's toolset to a temp folder each time they run, and
      # the builder ships those unsigned. The lane compiles its installer
      # from a copy of the toolset whose plugin folders it has signed;
      # the builder reads the two folders from the environment.
      - &sign_toolset_step
        name: Sign the installer toolset
        if: matrix.os == 'windows-2022' && steps.win_sign.outputs.enabled == 'true'
        working-directory: apps/desktop
        shell: bash
        run: |
          toolset="$(cygpath -m "$RUNNER_TEMP")/installer-toolset"
          node scripts/build/stage-nsis-toolset.js "$toolset"
          node scripts/build/sign-windows.js "$toolset/nsis/Plugins/x86-unicode"
          node scripts/build/sign-windows.js "$toolset/resources/plugins/x86-unicode"
          echo "ELECTRON_BUILDER_NSIS_DIR=$(cygpath -w "$toolset/nsis")" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_NSIS_RESOURCES_DIR=$(cygpath -w "$toolset/resources")" >> "$GITHUB_ENV"
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # The builder signs what only exists while it packages — the
      # elevation helper it copies into the tree, the uninstaller, the
      # installers — through the same script (`OH_WIN_SIGN`), and hashes
      # each signed installer into its update pointer and blockmap.
      - name: Package installers from signed tree
        if: matrix.os == 'windows-2022' && steps.win_sign.outputs.enabled == 'true'
        working-directory: apps/desktop
        shell: bash
        run: |
          if [ "${{ steps.detect_beta.outputs.is_beta }}" == "true" ]; then
            pnpm dist:win:frompacked:beta
          else
            pnpm dist:win:frompacked
          fi
        env:
          OH_WIN_SIGN: '1'
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # A file without a valid signature must fail the leg — publishing
      # a broken-signed Setup.exe whose hash the feed pointer carries is
      # worse than publishing unsigned. Read here: every PE file in the
      # tree, the installers, the uninstaller inside the Setup.exe, and
      # the plugin libraries the installer and the uninstaller carry.
      - &verify_signatures_step
        name: Verify signatures
        if: matrix.os == 'windows-2022' && steps.win_sign.outputs.enabled == 'true'
        run: |
          $dist = "apps/desktop/dist"
          $unpacked = "$dist/win${{ matrix.arch == 'arm64' && '-arm64' || '' }}-unpacked"
          $files = @(node apps/desktop/scripts/build/sign-windows.js --list $unpacked)
          if ($LASTEXITCODE -ne 0 -or $files.Count -eq 0) { Write-Error "No PE file listed under $unpacked"; exit 1 }

          $setup = @(Get-ChildItem -Path $dist -Filter "*-Setup.exe" -File)
          if ($setup.Count -ne 1) { Write-Error "Expected one Setup.exe, found $($setup.Count)"; exit 1 }
          $setupPath = $setup[0].FullName
          $files += $setupPath
          $files += @(Get-ChildItem -Path $dist -Filter "*.msi" -File | ForEach-Object { $_.FullName })

          $inside = Join-Path $env:RUNNER_TEMP "setup-contents"
          7z x $setupPath "-o$inside" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "Could not unpack $setupPath (7z exit $LASTEXITCODE)"; exit 1 }
          $uninstaller = @(Get-ChildItem -LiteralPath $inside -Recurse -Filter "Uninstall*.exe" -File)
          if ($uninstaller.Count -ne 1) { Write-Error "Expected one uninstaller in the Setup.exe, found $($uninstaller.Count)"; exit 1 }
          $files += $uninstaller[0].FullName

          $insideUninstaller = Join-Path $env:RUNNER_TEMP "uninstaller-contents"
          7z x $uninstaller[0].FullName "-o$insideUninstaller" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "Could not unpack $($uninstaller[0].FullName) (7z exit $LASTEXITCODE)"; exit 1 }
          foreach ($contents in $inside, $insideUninstaller) {
            $plugins = @(Get-ChildItem -LiteralPath $contents -Recurse -Filter "*.dll" -File)
            if ($plugins.Count -eq 0) { Write-Error "No plugin library found under $contents"; exit 1 }
            $files += $plugins | ForEach-Object { $_.FullName }
          }

          $invalid = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f
            Write-Host "$($sig.Status)  $($sig.SignerCertificate.Subject)  $f"
            if ($sig.Status -ne 'Valid') { $invalid++ }
          }
          if ($invalid -gt 0) { Write-Error "$invalid of $($files.Count) files carry no valid signature"; exit 1 }
          Write-Host "All $($files.Count) signatures are valid"
        shell: pwsh

      # Betas ship AppImage + deb for both arches — rpm is the one
      # Linux target betas skip (dnf users ride stable).
      # Stable legs build their arch's three targets.
      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/desktop
        run: |
          if [ "${{ steps.detect_beta.outputs.is_beta }}" == "true" ]; then
            pnpm dist:linux:beta:${{ matrix.arch }}
          else
            pnpm dist:linux:${{ matrix.arch }}

            if [ $(find dist -name "*.rpm" -type f | wc -l) -eq 0 ]; then
              echo "::warning::RPM packages not found, trying explicit build..."
              pnpm dist:linux:rpm:${{ matrix.arch }}
            fi
          fi
        shell: bash

      # The load check: the license chunk's bytecode and the database
      # binary are loaded inside the unpacked app's own runtime — a
      # package that cannot load them cannot start, and fails its leg
      # here instead of shipping. On the signed Windows x64 lane this is
      # the signed tree, so the signed executable is proven to run too.
      - name: Check the package loads
        working-directory: apps/desktop
        shell: bash
        run: node scripts/build/probe-package-load.js dist "${{ steps.leg_target.outputs.target }}"

      # The ARM tree travels to the x64 job that signs and packages it;
      # a day covers that hand-off.
      - name: Upload Windows ARM64 unpacked tree
        if: matrix.os == 'windows-11-arm'
        id: upload_unpacked
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unpacked-windows-arm64
          if-no-files-found: error
          retention-days: 1
          path: apps/desktop/dist/win-arm64-unpacked

      - name: Upload Windows ARM64 unpacked tree (retry)
        if: steps.upload_unpacked.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unpacked-windows-arm64
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          path: apps/desktop/dist/win-arm64-unpacked

      # The mac oh/ohd pair used to ride this leg (10×-billed macOS
      # minutes made a second runner the pipeline's most expensive
      # overhead); that economics died with the move to free public
      # runners, so the pair lives in build-binaries' macos row again —
      # off this critical path.
      # The upload is retried once on failure (2026.9.0: the mac x64
      # leg's 564 MB blob uploaded whole, then one ECONNRESET on the
      # finalize call failed the leg and cost a rerun — the action
      # itself does not retry). Installers are already compressed, so
      # the artifact zip stores them; seven days covers a release's
      # verification window (the bytes' homes are the feed and the
      # release page). Only the update-info files travel — never
      # builder-debug.yml. The ARM Windows leg has no installer yet —
      # its packaging job uploads that.
      - &upload_desktop_step
        name: Upload desktop artifacts
        if: matrix.os != 'windows-11-arm'
        id: upload_desktop
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          # A leg whose electron-builder wrote nothing must fail here,
          # not upload an empty artifact and stay green.
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.msi
            apps/desktop/dist/*.pkg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/beta*.yml

      - &upload_desktop_retry_step
        name: Upload desktop artifacts (retry)
        if: steps.upload_desktop.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.msi
            apps/desktop/dist/*.pkg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/beta*.yml

  # Windows ARM64 — a leg like the ones above, on an ARM runner and on
  # the same steps. It is a job of its own, not a row of that matrix,
  # because the job that packages its installer waits for it: a job
  # that needs a matrix waits for every leg of it, and the macOS ones
  # run twice as long.
  build-desktop-windows-arm64:
    name: build-desktop
    if: ${{ !contains(github.ref_name, '-ext') && !contains(github.ref_name, '-cli') && !contains(github.ref_name, '-daemon') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      OH_DESKTOP_CHANNEL: release
    strategy:
      matrix:
        include:
          - os: windows-11-arm
            arch: arm64
    steps: *desktop_leg_steps

  # The ARM installer is signed and packaged on x64 — signing does not
  # run on ARM runners. The unpacked tree the ARM leg built (and checked
  # on its own arch) arrives as an artifact; from there the lane is the
  # x64 leg's own, step for step: sign the tree, package the installer
  # from it with the builder signing as it goes, check every signature.
  # Without signing credentials the installer is packaged unsigned. No
  # MSI on ARM.
  package-desktop-windows-arm64:
    name: package-desktop
    needs: build-desktop-windows-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: windows-2022
            arch: arm64
    steps:
      - *checkout_step
      - *pnpm_step
      - *node_step
      - *setuptools_step
      - *install_step
      - *detect_beta_step
      - *version_pin_step
      - *win_sign_check_step

      - name: Download the unpacked tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unpacked-windows-arm64
          path: apps/desktop/dist/win-arm64-unpacked

      - *sign_tree_step
      - *sign_toolset_step

      - name: Package the installer from the tree
        working-directory: apps/desktop
        shell: bash
        run: pnpm dist:win:frompacked:arm64
        env:
          OH_WIN_SIGN: ${{ steps.win_sign.outputs.enabled == 'true' && '1' || '' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - *verify_signatures_step
      - *upload_desktop_step
      - *upload_desktop_retry_step

  # Standalone `oh` and `ohd` (win32 is not a daemon target) ship on
  # STABLE tags only — betas carry no standalone binaries: the daemon
  # beta testers exercise is the desktop-embedded one, and the beta
  # versions manifest carries cli/daemon forward from the last stable
  # (release job). The macOS pair is a matrix row here like the others
  # — it once rode the desktop macos leg because macOS minutes billed
  # at 10×, but on free public runners the repeated setup costs
  # nothing and riding the desktop leg put it on the release's
  # critical path. Versions come from each app's own package.json (the
  # extension precedent) — the tag stays the desktop's version axis.
  # Runtime split: `oh` is bun-compiled, `ohd` stays Node SEA
  # — two toolchains, one leg, no cross-contamination.
  build-binaries:
    if: ${{ github.event_name != 'workflow_dispatch' && !contains(github.ref_name, '-ext') && !contains(github.ref_name, '-cli') && !contains(github.ref_name, '-daemon') && !contains(github.ref_name, '-beta') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    # 2026.9.0: 6 min per leg.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so build stamps derived from commit counts
          # mean something on release binaries.
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Setup Bun
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # The Bun release CDN answered 504 for longer than the action's
      # own two retries (v2026.9.2, the Linux x64 leg): one more attempt
      # after a real pause, the upload-retry idiom.
      - name: Wait before Bun retry
        if: steps.setup_bun.outcome == 'failure'
        run: sleep 60
        shell: bash

      - name: Setup Bun (retry)
        if: steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Insurance law: the CLI source stays
      # runtime-neutral, proven by running its unit suite under bun on
      # every stable release; the regular CI lane runs it under Node.
      - name: Run CLI unit suite under bun
        working-directory: apps/cli
        run: bun --bun vitest run
        shell: bash

      # pack:bun compiles src straight to a self-contained binary
      # (minified, JSC bytecode) and verifies the binary's contract
      # before anything ships.
      - name: Build and verify oh bun binary
        run: pnpm --filter @openheaders/cli run pack:bun
        shell: bash

      # Same signing path as the desktop leg: the downloaded CLI exe
      # trips SmartScreen unsigned, and `install-oh.ps1` fails under
      # AllSigned execution policies. Deterministic pre-stage paths, so
      # no find step; missing secrets degrade to unsigned (the job
      # itself is stable-only).
      - name: Check Windows signing credentials
        if: matrix.os == 'windows-2022'
        id: win_sign
        run: |
          if [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::notice::Windows signing secrets not configured - publishing unsigned oh.exe"
          fi
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Sign oh CLI executable
        if: matrix.os == 'windows-2022' && steps.win_sign.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ env.WIN_SIGN_ENDPOINT }}
          signing-account-name: ${{ env.WIN_SIGN_ACCOUNT }}
          certificate-profile-name: ${{ env.WIN_SIGN_PROFILE }}
          files: ${{ github.workspace }}\apps\cli\dist-bun\oh.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign Windows install script
        if: matrix.os == 'windows-2022' && steps.win_sign.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ env.WIN_SIGN_ENDPOINT }}
          signing-account-name: ${{ env.WIN_SIGN_ACCOUNT }}
          certificate-profile-name: ${{ env.WIN_SIGN_PROFILE }}
          files: ${{ github.workspace }}\apps\cli\scripts\install.ps1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The signed exe must still answer — a signature that breaks the
      # binary is worse than no signature.
      - name: Verify CLI signatures
        if: matrix.os == 'windows-2022' && steps.win_sign.outputs.enabled == 'true'
        run: |
          foreach ($f in @("apps/cli/dist-bun/oh.exe", "apps/cli/scripts/install.ps1")) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f -> $($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              Write-Error "Authenticode signature status for ${f}: $($sig.Status)"
              exit 1
            }
          }
          & "apps/cli/dist-bun/oh.exe" --version
          if ($LASTEXITCODE -ne 0) { Write-Error "signed oh.exe no longer runs"; exit 1 }
        shell: pwsh

      # The ohd SEA payload embeds the platform's HTTP/3 helper — this
      # leg has its own checkout, so it builds its own (host target).
      - name: Cache cargo (HTTP/3 helper)
        if: matrix.os != 'windows-2022'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/h3-helper/target
          key: ${{ runner.os }}-h3-helper-${{ hashFiles('native/h3-helper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-h3-helper-

      - name: Build HTTP/3 helper
        if: matrix.os != 'windows-2022'
        run: node scripts/build-h3-helper.mjs
        shell: bash

      # The daemon binary embeds the built web app when present.
      - name: Build and verify ohd SEA binary
        if: matrix.os != 'windows-2022'
        run: |
          pnpm turbo build --filter=@openheaders/daemon --filter=@openheaders/web
          pnpm --filter @openheaders/daemon run pack:sea
        shell: bash

      - name: Setup macOS code signing
        if: matrix.os == 'macos-latest'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      # The pack scripts leave ad-hoc/unsigned binaries; re-sign with
      # Developer ID (hardened runtime + timestamp, required for
      # notarization), then notarize both binaries in one submission.
      # Flat binaries can't be stapled — Gatekeeper resolves the ticket
      # from Apple's servers on first quarantined run.
      - name: Sign and notarize binaries (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in the keychain"
            exit 1
          fi
          mkdir -p notarize-stage
          # Hardened runtime without the JIT entitlements SIGTRAPs the
          # JS engine on user machines — V8 for the Node SEA `ohd`, JSC
          # for the bun-compiled `oh` (the runner's own probe does not
          # enforce them).
          for BINARY in apps/cli/dist-bun/oh apps/daemon/dist-sea/ohd; do
            codesign --force --sign "$IDENTITY" --options runtime --timestamp \
              --entitlements .github/sea-entitlements.plist "$BINARY"
            codesign --verify --strict "$BINARY"
            codesign -d --entitlements - "$BINARY" 2>&1 | grep -q allow-jit
            # The signed binary must still answer
            "$BINARY" --version
            cp "$BINARY" notarize-stage/
          done
          ditto -c -k notarize-stage notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # The container is the same verified SEA binary in an LTS base;
      # the probe re-runs boot + /healthz inside it before anything is
      # pushed (glibc drift between runner and base would surface here).
      # ghcr is a recoverable channel like GitHub Releases, so it rides
      # the pipeline. Only the VERSION tag is pushed here — `:latest`
      # is a pointer like the feed's, and the release job moves it
      # after the feed pointers, never before the release exists.
      - name: Build and push ohd Docker image
        if: matrix.os == 'ubuntu-latest' && github.repository_owner == 'OpenHeaders'
        run: |
          OHD_VERSION=$(node -p "require('./apps/daemon/package.json').version")
          IMAGE=ghcr.io/openheaders/ohd

          docker build --build-arg OHD_VERSION="$OHD_VERSION" -t "$IMAGE:$OHD_VERSION" apps/daemon
          docker run --rm "$IMAGE:$OHD_VERSION" --version

          CONTAINER=$(docker run -d -p 18637:8137 "$IMAGE:$OHD_VERSION")
          HEALTHY=""
          for _ in $(seq 1 60); do
            if curl -fs http://127.0.0.1:18637/healthz > /dev/null; then
              HEALTHY=1
              break
            fi
            sleep 1
          done
          if [ -z "$HEALTHY" ]; then
            docker logs "$CONTAINER"
            echo "::error::ohd container never answered /healthz"
            exit 1
          fi
          docker rm -f "$CONTAINER"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$OHD_VERSION"
          docker logout ghcr.io
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage binary assets
        run: |
          mkdir -p release-binaries
          OH_VERSION=$(node -p "require('./apps/cli/package.json').version")
          case "${{ matrix.os }}" in
            macos-latest) OS_ARCH=mac-arm64 ;;
            ubuntu-latest) OS_ARCH=linux-x64 ;;
            windows-2022) OS_ARCH=win-x64 ;;
          esac
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp apps/cli/dist-bun/oh.exe "release-binaries/oh-${OH_VERSION}-${OS_ARCH}.exe"
            # Travels via artifact so the release job stages the signed
            # copy instead of the plain one from its own checkout.
            cp apps/cli/scripts/install.ps1 release-binaries/install-oh.ps1
          else
            OHD_VERSION=$(node -p "require('./apps/daemon/package.json').version")
            cp apps/cli/dist-bun/oh "release-binaries/oh-${OH_VERSION}-${OS_ARCH}"
            cp apps/daemon/dist-sea/ohd "release-binaries/ohd-${OHD_VERSION}-${OS_ARCH}"
          fi
          # One leg generates the aggregated license texts for the
          # bundled JS closure — identical across platforms, ships as
          # a release asset beside the binaries.
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            node scripts/generate-third-party-notices.mjs --out release-binaries/THIRD-PARTY-NOTICES-oh-ohd.txt apps/cli apps/daemon
          fi
        shell: bash

      - name: Upload binary artifacts
        id: upload_binaries
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.os }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: release-binaries/*

      - name: Upload binary artifacts (retry)
        if: steps.upload_binaries.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.os }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
          path: release-binaries/*

  # No extension leg: extension distribution is store-listings only
  # (stable AND beta) — releases carry no extension zips. The release
  # body still links the stores; the extension version is read from
  # apps/extension/package.json.

  release:
    # Every needed job must have SUCCEEDED — a failed leg publishes
    # nothing (2026.9.0 shipped a one-arch latest-mac.yml for 49
    # minutes off a failed mac x64 leg). `!cancelled()` only makes the
    # expression evaluate when a needed job failed or was skipped (the
    # default would skip this job silently); the result checks decide.
    # build-binaries is stable-only, so a beta sees it skipped. The
    # Windows ARM64 packaging job stands for its leg too — it only runs
    # when that leg succeeded.
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && !contains(github.ref_name, '-ext') && !contains(github.ref_name, '-cli') && !contains(github.ref_name, '-daemon') && needs.build-desktop.result == 'success' && needs.package-desktop-windows-arm64.result == 'success' && (needs.build-binaries.result == 'success' || (contains(github.ref_name, '-beta') && needs.build-binaries.result == 'skipped')) }}
    needs: [build-desktop, package-desktop-windows-arm64, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # 2026.9.0: 18 min, of which 17 were the two serial uploads.
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine release type
        id: release_type
        run: |
          TAG_NAME=${GITHUB_REF_NAME}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          if [[ "$TAG_NAME" =~ -beta[.0-9]*$ ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      # Canonical-form gate for every changelog projection below —
      # asset-budget overruns warn, form violations fail the release
      # before anything is published.
      - name: Lint changelog tree
        run: node scripts/lint-changelog.mjs

      # The legs' packages and the standalone binaries, each artifact
      # in its own folder — by name, so the Windows ARM64 unpacked tree
      # (a hand-off between two jobs) stays behind.
      - name: Download desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: dist

      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: dist

      # Store listings serve the extension (stable only — it has no
      # beta channel), so the body's store table renders on stable only.
      - name: Read extension version
        id: ext_ver
        if: steps.release_type.outputs.is_prerelease == 'false'
        run: |
          EXT_VERSION=$(node -p "require('./apps/extension/package.json').version")
          echo "version=$EXT_VERSION" >> $GITHUB_OUTPUT
          echo "Extension version: $EXT_VERSION"

      # Secrets are not readable in step `if:` expressions; missing R2
      # credentials degrade to GitHub-hosted downloads instead of
      # failing the release.
      - name: Check R2 credentials
        id: r2
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::R2 secrets not configured — feed not updated, downloads served from GitHub"
          fi
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # The single authority for where downloads live. With R2, every
      # printed and machine-read download URL is an own-domain form
      # — corporate networks only ever need
      # openheaders.com reachable. Artifacts also land on the GitHub
      # release page as a human-browsable redundant copy.
      - name: Determine download base
        id: dl_base
        run: |
          if [ "${{ steps.r2.outputs.enabled }}" = "true" ]; then
            echo "url=https://updates.openheaders.com/dl/${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "url=https://github.com/${RELEASE_REPO}/releases/download/${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Process artifacts for release
        run: |
          mkdir -p processed_files
          VERSION=${GITHUB_REF_NAME/v/}

          # Desktop artifacts. electron-builder names the update-info
          # files after the version's channel (latest*.yml on stable,
          # beta*.yml on prerelease) — copy both shapes; the feed
          # generator normalizes them. builder-debug.yml stays behind.
          # Every OS builds one leg per arch — walk every arch directory
          # (the Windows x64 one carries no arch in its name). The
          # Windows and mac update-info files are handled by the merges
          # below, not copied here.
          for d in dist/desktop-windows-2022*; do
            [ -d "$d" ] || continue
            cp "$d"/*.exe processed_files/ 2>/dev/null || true
            cp "$d"/*.msi processed_files/ 2>/dev/null || true
            cp "$d"/*.blockmap processed_files/ 2>/dev/null || true
          done

          for d in dist/desktop-macos-latest-*; do
            [ -d "$d" ] || continue
            cp "$d"/*.dmg processed_files/ 2>/dev/null || true
            cp "$d"/*.pkg processed_files/ 2>/dev/null || true
            cp "$d"/*.zip processed_files/ 2>/dev/null || true
            cp "$d"/*.blockmap processed_files/ 2>/dev/null || true
          done

          # The two legs of macOS, and the two of Windows, each write a
          # one-arch update-info file; the feed serves ONE per OS
          # (latest-mac.yml, latest.yml), so union their files lists.
          # Every tag on either channel builds both arches, so both
          # files are required (one alone would strand the other arch's
          # updater); a merge conflict fails the release before any
          # pointer is published. On Windows the x64 installer's name
          # says no arch, and the merge lists it first: an x64 updater
          # takes the first entry, an ARM one the entry named arm64.
          for NAME in latest-mac.yml beta-mac.yml; do
            MAC_YMLS=$(find dist -path "dist/desktop-macos-latest-*" -name "$NAME" | sort)
            if [ -n "$MAC_YMLS" ]; then
              node scripts/merge-update-yml.mjs --min-inputs=2 "processed_files/$NAME" $MAC_YMLS
            fi
          done
          for NAME in latest.yml beta.yml; do
            WIN_YMLS=$(find dist -path "dist/desktop-windows-2022*" -name "$NAME" | sort)
            if [ -n "$WIN_YMLS" ]; then
              node scripts/merge-update-yml.mjs --min-inputs=2 "processed_files/$NAME" $WIN_YMLS
            fi
          done

          # The linux update-info files are per-arch NAMED
          # (latest-linux.yml x64, latest-linux-arm64.yml arm64), so
          # each leg's copy lands beside the other — no merge.
          for d in dist/desktop-ubuntu-latest-*; do
            [ -d "$d" ] || continue
            cp "$d"/*.AppImage processed_files/ 2>/dev/null || true
            cp "$d"/*.deb processed_files/ 2>/dev/null || true
            find "$d" -name "*.rpm" -exec cp {} processed_files/ \; 2>/dev/null || true
            cp "$d"/latest-linux.yml processed_files/ 2>/dev/null || true
            cp "$d"/latest-linux-arm64.yml processed_files/ 2>/dev/null || true
            cp "$d"/beta-linux.yml processed_files/ 2>/dev/null || true
            cp "$d"/beta-linux-arm64.yml processed_files/ 2>/dev/null || true
          done

          # Standalone oh/ohd binaries + one checksums file over them
          find dist -path 'dist/binaries-*' -type f -exec cp {} processed_files/ \;
          BINS=$(cd processed_files && ls oh-* ohd-* 2>/dev/null || true)
          if [ -n "$BINS" ]; then
            (cd processed_files && shasum -a 256 $BINS > SHA256SUMS.txt)
            # Installer scripts ride every release so the stable
            # /releases/latest/download one-liners always resolve. The
            # ps1 is the windows-leg artifact copy ONLY — that one is
            # Authenticode-signed; the checkout copy is not, and the
            # body says it is signed, so a missing artifact copy fails
            # the release rather than shipping the unsigned one.
            cp apps/cli/scripts/install.sh processed_files/install-oh.sh
            if [ ! -f processed_files/install-oh.ps1 ]; then
              echo "::error::install-oh.ps1 (the signed windows-leg copy) is missing from the binaries artifact"
              exit 1
            fi
          fi

          echo "Files prepared for release:"
          ls -la processed_files/
        shell: bash

      # The expected-asset manifest: every file the tag's channel ships
      # must be staged, non-empty, and every update-info pointer must
      # carry the tag's version — checked here, before any upload, so
      # a leg that succeeded without its file, a naming drift, or a
      # pointer family out of step fails with the names, never as a
      # published URL to nothing.
      - name: Assert release manifest
        run: node scripts/assert-release-manifest.mjs "$GITHUB_REF_NAME" processed_files

      # Detached GPG signature over the checksums manifest — a trust
      # root beyond TLS for the standalone binaries. Missing key means
      # the manifest ships unsigned instead of failing the release.
      - name: Sign checksums manifest
        run: |
          if [ ! -f processed_files/SHA256SUMS.txt ]; then
            exit 0
          fi
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::notice::GPG_PRIVATE_KEY not configured - SHA256SUMS.txt ships unsigned"
            exit 0
          fi
          # A throwaway keyring, gone when the step ends — the secret
          # key never lands in the runner's default home; the
          # passphrase travels on stdin, never in an argv `ps` can read.
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'rm -rf "$GNUPGHOME"' EXIT
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --armor --detach-sign \
            --output processed_files/SHA256SUMS.txt.asc processed_files/SHA256SUMS.txt
          gpg --verify processed_files/SHA256SUMS.txt.asc processed_files/SHA256SUMS.txt
          # The public key rides along so a release is verifiable on its
          # own; the canonical fingerprint cross-check lives at
          # https://openheaders.com/gpg and SECURITY.md.
          gpg --batch --armor --export security@openheaders.io \
            > processed_files/openheaders-release-key.asc
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # versions.json — the static severity manifest. Clients fetch it
      # anonymously from the update feed at versions/<channel>.json;
      # the release-page copy is redundant. Severity is authored in
      # .github/release-severity.json before tagging, never inferred.
      - name: Generate versions manifest
        run: |
          node scripts/generate-versions-manifest.mjs "$GITHUB_REF_NAME" > processed_files/versions.json
          cat processed_files/versions.json

      # The store cron (check-store-versions.yml) keeps `extension.stores`
      # live on the channel manifest; the generator builds fresh and would
      # drop it until the next cron run. Carry the live object forward.
      # Betas additionally carry cli/daemon whole, from the live STABLE
      # manifest: beta tags stage no standalone binaries, so those
      # entries must name the newest tag whose release page actually
      # hosts them — always a stable one. The CLI's update check and
      # the website's install one-liners build download URLs from
      # `tag`, and carrying from the beta manifest would freeze them at
      # the last binary-bearing beta forever.
      #
      # The live stable manifest is read ONCE, retried, and its absence
      # is FATAL on both channels: a stable that cannot read it would
      # publish a manifest without `extension.stores` (the website's
      # download surfaces go blind until the cron's next pass); a beta
      # would name cli/daemon at a beta tag whose page hosts no
      # binaries. Nothing has been uploaded at this point, so a failure
      # here publishes nothing and the release job can simply run again
      # once the feed answers. A manifest that lacks an entry is still
      # "nothing to carry" — that is a state, not a read failure.
      #
      # The live BETA manifest is read the same way for the stable
      # overtake (feed staging below): a 404 is the state "no beta
      # channel yet" (an empty manifest), any other failure is fatal
      # for the same reason — a stable that cannot see the beta channel
      # cannot know whether it overtakes it.
      - name: Carry forward live manifest entries
        run: |
          CHANNEL=stable
          if [ "${{ steps.release_type.outputs.is_prerelease }}" = "true" ]; then CHANNEL=beta; fi
          if ! curl -fsS --retry 3 --retry-all-errors --max-time 30 \
            "https://updates.openheaders.com/versions/stable.json" -o live_stable.json; then
            echo "::error::the live stable manifest (versions/stable.json) could not be read — nothing carried forward, nothing published"
            exit 1
          fi
          BETA_STATUS=$(curl -sS --retry 3 --retry-all-errors --max-time 30 -w '%{http_code}' \
            "https://updates.openheaders.com/versions/beta.json" -o live_beta.json || echo "000")
          case "$BETA_STATUS" in
            200) echo "Live beta manifest read" ;;
            404) echo '{}' > live_beta.json; echo "No live beta manifest — the beta channel has none yet" ;;
            *)
              echo "::error::the live beta manifest (versions/beta.json) answered ${BETA_STATUS} — nothing published"
              exit 1 ;;
          esac
          # Stores carry on stable only — the beta manifest carries no
          # extension entry at all (stores are the extension's only
          # channel; no sideload zips exist on any channel).
          if [ "$CHANNEL" = "stable" ]; then
            STORES=$(jq -c '.extension.stores // empty' live_stable.json)
            if [ -n "$STORES" ]; then
              node scripts/patch-versions-entry.mjs processed_files/versions.json extension \
                "{\"stores\":${STORES}}" > versions_with_stores.json
              mv versions_with_stores.json processed_files/versions.json
              echo "Carried extension.stores: ${STORES}"
            else
              echo "Live stable manifest has no extension.stores — nothing to carry"
            fi
          fi
          if [ "$CHANNEL" = "beta" ]; then
            for APP in cli daemon; do
              ENTRY=$(jq -c ".${APP} // empty" live_stable.json)
              if [ -n "$ENTRY" ]; then
                node scripts/patch-versions-entry.mjs processed_files/versions.json "$APP" \
                  "$ENTRY" > versions_patched.json
                mv versions_patched.json processed_files/versions.json
                echo "Carried ${APP} entry from stable: ${ENTRY}"
              else
                echo "Live stable manifest has no ${APP} entry — nothing to carry"
              fi
            done
          fi
          cat processed_files/versions.json

      - name: Generate Release Body
        run: |
          VERSION=${GITHUB_REF_NAME/v/}
          EXT_VERSION="${{ steps.ext_ver.outputs.version }}"
          IS_PRERELEASE="${{ steps.release_type.outputs.is_prerelease }}"
          REPO="$RELEASE_REPO"

          DL="${{ steps.dl_base.outputs.url }}"
          ICONS="https://raw.githubusercontent.com/${REPO}/main/docs/assets"
          SUMS_LINE="Checksums: [SHA256SUMS.txt](${DL}/SHA256SUMS.txt)"
          if [ -f processed_files/SHA256SUMS.txt.asc ]; then
            SUMS_LINE="${SUMS_LINE} · [GPG signature](${DL}/SHA256SUMS.txt.asc) · [signing key](https://openheaders.com/gpg)"
          fi

          {
            echo "<p align=\"center\"><img src=\"${ICONS}/logo.svg\" width=\"88\" alt=\"Open Headers\"></p>"
            echo ""
          } > release_body.md

          if [ "$IS_PRERELEASE" = "true" ]; then
            echo '> **This is a beta build for early testing.** It may contain bugs.' >> release_body.md
            echo '' >> release_body.md
          fi

          # Brand icons live in this repo's docs/assets/ directory —
          # markdown img tags are the only way GitHub renders svg in a
          # release body.
          icon() { echo "<img src=\"${ICONS}/$1.svg\" width=\"16\" align=\"center\">"; }
          I_MAC=$(icon macos)
          I_WIN=$(icon windows)
          I_LINUX=$(icon linux)
          I_DEBIAN=$(icon debian)
          I_FEDORA=$(icon fedora)
          I_CHROME=$(icon chrome)
          I_FIREFOX=$(icon firefox)
          I_EDGE=$(icon edge)
          I_DOCKER=$(icon docker)

          # Tables lead, prose collapses into <details> — the reader is
          # here for download links. Every desktop link is derived from
          # the STAGED files (like bin_row below): a cell renders only
          # when its file is in processed_files, so the table can never
          # name an asset that does not exist — betas' trimmed target
          # set (dmg/zip, Setup.exe, AppImage/deb on every arch; no
          # rpm, pkg, msi) falls out of that. No section title carries a
          # version: the desktop version IS the release tag, and the
          # independently-versioned surfaces (extension, oh, ohd) show
          # theirs in asset filenames / store pages.
          dl_link() {
            if [ -f "processed_files/$2" ]; then printf '[%s](%s/%s)' "$1" "$DL" "$2"; fi
          }
          row() {
            local platform="$1" cells=""
            shift
            for cell in "$@"; do
              [ -n "$cell" ] || continue
              cells="${cells:+${cells} · }${cell}"
            done
            if [ -n "$cells" ]; then echo "| ${platform} | ${cells} |"; fi
          }
          {
            echo "## Desktop App"
            echo ""
            echo "| Platform | Downloads |"
            echo "| --- | --- |"
            row "${I_MAC} macOS" \
              "$(dl_link 'Apple Silicon (DMG)' "OpenHeaders-${VERSION}-mac-arm64.dmg")" \
              "$(dl_link 'Intel (DMG)' "OpenHeaders-${VERSION}-mac-x64.dmg")"
            row "${I_WIN} Windows" \
              "$(dl_link 'x64 (EXE)' "OpenHeaders-${VERSION}-Setup.exe")" \
              "$(dl_link 'ARM64 (EXE)' "OpenHeaders-${VERSION}-arm64-Setup.exe")"
            row "${I_LINUX} Linux" \
              "$(dl_link 'AppImage x64' "OpenHeaders-${VERSION}-x86_64.AppImage")" \
              "$(dl_link 'AppImage ARM64' "OpenHeaders-${VERSION}-arm64.AppImage")"
            row "${I_DEBIAN} Debian / Ubuntu" \
              "$(dl_link 'x64 (deb)' "open-headers_${VERSION}_amd64.deb")" \
              "$(dl_link 'ARM64 (deb)' "open-headers_${VERSION}_arm64.deb")"
            row "${I_FEDORA} Fedora / RHEL" \
              "$(dl_link 'x64 (rpm)' "open-headers-${VERSION}.x86_64.rpm")" \
              "$(dl_link 'ARM64 (rpm)' "open-headers-${VERSION}.aarch64.rpm")"
            if [ "$IS_PRERELEASE" != "true" ]; then
              echo ""
              echo "<details><summary><b>Enterprise - Managed deployment (MDM / GPO)</b></summary>"
              echo ""
              echo "| Platform | Downloads |"
              echo "| --- | --- |"
              row "${I_MAC} macOS" \
                "$(dl_link 'PKG Apple Silicon' "OpenHeaders-${VERSION}-mac-arm64.pkg")" \
                "$(dl_link 'PKG Intel' "OpenHeaders-${VERSION}-mac-x64.pkg")"
              row "${I_WIN} Windows" "$(dl_link 'MSI' "OpenHeaders-${VERSION}.msi")"
              echo ""
              echo "macOS PKGs are signed and notarized; the Windows MSI is Authenticode-signed."
              echo ""
              echo "</details>"
            fi
          } >> release_body.md

          if [ -n "$EXT_VERSION" ]; then
            STORE_CHROME="https://chromewebstore.google.com/detail/ablaikadpbfblkmhpmbbnbbfjoibeejb"
            STORE_FIREFOX="https://addons.mozilla.org/en-US/firefox/addon/open-headers/"
            STORE_EDGE="https://microsoftedge.microsoft.com/addons/detail/open-headers/gnbibobkkddlflknjkgcmokdlpddegpo"
            {
              echo ""
              echo "## Browser Extension"
              echo ""
              echo "| Browser | Store |"
              echo "| --- | --- |"
              echo "| ${I_CHROME} Chrome | [Chrome Web Store](${STORE_CHROME}) |"
              echo "| ${I_FIREFOX} Firefox | [Firefox Add-ons](${STORE_FIREFOX}) |"
              echo "| ${I_EDGE} Edge | [Edge Add-ons](${STORE_EDGE}) |"
            } >> release_body.md
          fi

          # oh/ohd binaries carry their own app versions — list what
          # the legs actually staged, one section per product surface.
          BIN_FILES=$(cd processed_files && ls oh-* ohd-* 2>/dev/null || true)
          OH_FILES=$(echo "$BIN_FILES" | tr ' ' '\n' | grep '^oh-' || true)
          OHD_FILES=$(echo "$BIN_FILES" | tr ' ' '\n' | grep '^ohd-' || true)

          bin_row() {
            case "$1" in
              *-mac-arm64) PLATFORM="${I_MAC} macOS (Apple Silicon)" ;;
              *-mac-x64) PLATFORM="${I_MAC} macOS (Intel)" ;;
              *-linux-x64) PLATFORM="${I_LINUX} Linux (x64)" ;;
              *-linux-arm64) PLATFORM="${I_LINUX} Linux (ARM64)" ;;
              *-win-x64.exe) PLATFORM="${I_WIN} Windows (x64)" ;;
              *) PLATFORM="$1" ;;
            esac
            echo "| ${PLATFORM} | [$1](${DL}/$1) |"
          }

          if [ -n "$OH_FILES" ]; then
            {
              echo ""
              echo "## Terminal - CLI & TUI"
              echo ""
              echo "| Platform | Download |"
              echo "| --- | --- |"
              for f in $OH_FILES; do bin_row "$f"; done
              echo ""
              echo "${SUMS_LINE}"
              echo ""
              echo "<details><summary><b>Install scripts & notes</b></summary>"
              echo ""
              echo "Install script (verifies checksums, installs \`oh\` to \`~/.local/bin\`):"
              echo ""
              echo '```sh'
              echo "curl -fsSL https://updates.openheaders.com/install.sh | sh"
              echo '```'
              echo ""
              echo "Windows (PowerShell):"
              echo ""
              echo '```powershell'
              echo "irm https://updates.openheaders.com/install.ps1 | iex"
              echo '```'
              echo ""
              echo "No Node.js required (\`npm install -g @openheaders/cli\` is the Node channel). macOS binaries are signed and notarized; the Windows \`oh\` is Authenticode-signed. Script copies on this page: [install-oh.sh](${DL}/install-oh.sh) · [install-oh.ps1](${DL}/install-oh.ps1)"
              echo ""
              echo "</details>"
            } >> release_body.md
          fi

          if [ -n "$OHD_FILES" ]; then
            OHD_DOCKER_VERSION=$(echo "$OHD_FILES" | sed -n 's/^ohd-\([0-9][^ ]*\)-linux-x64$/\1/p' | head -1)
            {
              echo ""
              echo "## Team - Server Daemon"
              echo ""
              echo "| Platform | Download |"
              echo "| --- | --- |"
              for f in $OHD_FILES; do bin_row "$f"; done
              if [ -n "$OHD_DOCKER_VERSION" ]; then
                echo "| ${I_DOCKER} Docker | \`ghcr.io/openheaders/ohd:${OHD_DOCKER_VERSION}\` |"
              fi
              echo ""
              echo "${SUMS_LINE}"
              echo ""
              echo "<details><summary><b>Install scripts & notes</b></summary>"
              echo ""
              echo "Install script (verifies checksums, installs \`oh\` + \`ohd\` to \`~/.local/bin\`):"
              echo ""
              echo '```sh'
              echo "curl -fsSL https://updates.openheaders.com/install.sh | sh -s -- --with-daemon"
              echo '```'
              if [ -n "$OHD_DOCKER_VERSION" ]; then
                echo ""
                echo "Docker:"
                echo ""
                echo '```sh'
                echo "docker run -d -p 127.0.0.1:8137:8137 -v oh-data:/data ghcr.io/openheaders/ohd:${OHD_DOCKER_VERSION}"
                echo '```'
              fi
              echo ""
              echo "</details>"
            } >> release_body.md
          fi

      # The canonical entry's body rides the release page too
      # (the changelog plan §4.2) — appended after the download tables so
      # the Releases tab reads as a full changelog with no extra
      # authoring. Stubs and missing entries append nothing.
      - name: Append changelog entry to release body
        run: |
          VERSION_BASE=$(echo "${GITHUB_REF_NAME/v/}" | sed 's/-beta\.[0-9]*$//')
          node scripts/changelog-entry-body.mjs desktop "$VERSION_BASE" > entry_body.md
          if [ -s entry_body.md ]; then
            { echo ""; echo "---"; echo ""; echo "## What's New"; echo ""; cat entry_body.md; } >> release_body.md
            echo "Appended desktop ${VERSION_BASE} entry to the release body"
          else
            echo "No prose entry for desktop ${VERSION_BASE} — release body unchanged"
          fi

      # The update feed: static pointer files on R2 behind
      # updates.openheaders.com. The yml/json pointers carry absolute
      # URLs to this release's artifacts (the feed's own dl/ path, or
      # the GitHub assets when R2 is off). Everything below stages into
      # a local tree — no network beyond two fail-open reads — and runs
      # BEFORE any byte is uploaded or the release exists, so a staging
      # failure leaves nothing half-published. A beta tag stages only
      # beta/ paths — stable pointers can never move; a stable tag also
      # overtakes the beta channel's entries and pointers it is newer
      # than, so the beta channel never sits behind stable (the live
      # manifests read above decide). A beta older than the live stable
      # fails here.
      - name: Stage update feed pointers
        run: |
          node scripts/generate-update-feed.mjs "$GITHUB_REF_NAME" \
            "${{ steps.dl_base.outputs.url }}" \
            processed_files feed \
            --live-stable=live_stable.json --live-beta=live_beta.json

      # The signed apt repository (the distribution plan §8, Phase 7):
      # pool + dists staged into the same tree the pointer upload
      # walks, indexes signed in-lane with the DEDICATED archive key —
      # never the release GPG key. Missing key secrets or missing deb
      # artifacts degrade to "apt tree unchanged" instead of failing
      # the release; a key that does not match the committed keyring
      # fails hard (the deb postinst pins that keyring).
      #
      # When the stable overtook the beta desktop channel (the feed
      # staged desktop/beta/), its debs are re-indexed under apt/beta/
      # too, so beta-channel apt users receive the same stable; their
      # deb's postinst then registers the channel its version names.
      - name: Stage apt repository
        run: |
          node scripts/generate-apt-repo.mjs "$GITHUB_REF_NAME" processed_files feed
          if [ -d feed/desktop/beta ] && [ "${{ steps.release_type.outputs.is_prerelease }}" = "false" ]; then
            node scripts/generate-apt-repo.mjs "$GITHUB_REF_NAME" processed_files feed --channel=beta
          fi
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}

      # The signed rpm/dnf repository — the second Linux leg, same
      # posture as apt: staged into the same tree, repomd.xml signed
      # in-lane with the same DEDICATED archive key, missing secrets or
      # missing rpm artifacts degrade to "rpm tree unchanged".
      # createrepo_c reads the rpm headers and writes repodata/.
      - name: Stage rpm repository
        run: |
          sudo apt-get update && sudo apt-get install -y createrepo-c
          node scripts/generate-rpm-repo.mjs "$GITHUB_REF_NAME" processed_files feed
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}

      # Changelog feed objects (the changelog plan §4.1) stage into the
      # same tree the pointer upload walks. The previously published
      # index is merged in fail-open — it may carry rows for entry-less
      # releases the canonical tree never records.
      - name: Stage changelog feed objects
        run: |
          curl -fsS --max-time 30 "https://updates.openheaders.com/changelog/index.json" -o prior_index.json \
            || rm -f prior_index.json
          if [ -f prior_index.json ]; then
            node scripts/generate-changelog-feed.mjs "$GITHUB_REF_NAME" feed prior_index.json
          else
            echo "No live changelog index — generating from the tree alone"
            node scripts/generate-changelog-feed.mjs "$GITHUB_REF_NAME" feed
          fi
          find feed -type f | sort

      # Release bytes live on the feed bucket under an immutable
      # per-tag path — Cloudflare's edge caches them (a zone Cache Rule
      # keys /dl/* without query strings), R2 egress is free, and
      # corporate networks never need github.com. Uploaded BEFORE the
      # release and the pointer files exist, so no published URL can
      # name missing bytes. Pointer/channel files are excluded — their
      # home is desktop/<channel>/ and versions/.
      #
      # Every object is a conditional put (If-None-Match: *): a dl/ key
      # is written once and never overwritten. An existing key with the
      # same size is reported and left alone; a different size is a
      # hard error — two runs of one tag disagreeing on bytes is never
      # resolved by the later one winning. The objects are independent,
      # so they upload eight at a time.
      - name: Upload release artifacts to R2
        if: steps.r2.outputs.enabled == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          export ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          put_dl() {
            local file="$1" name key type
            name="$(basename "$file")"
            key="dl/${GITHUB_REF_NAME}/${name}"
            case "$name" in
              *.txt) type="text/plain; charset=utf-8" ;;
              *.asc) type="text/plain; charset=utf-8" ;;
              *.sh) type="text/x-shellscript; charset=utf-8" ;;
              *.ps1) type="text/plain; charset=utf-8" ;;
              *.zip) type="application/zip" ;;
              *) type="application/octet-stream" ;;
            esac
            local err
            # Per-tag paths never change — cache as immutable.
            if err=$(aws s3api put-object --bucket "$R2_BUCKET" --key "$key" --body "$file" \
              --endpoint-url "$ENDPOINT" --region auto \
              --content-type "$type" \
              --cache-control "public, max-age=31536000, immutable" \
              --if-none-match '*' 2>&1 >/dev/null); then
              echo "put ${key}"
              return 0
            fi
            if ! grep -q PreconditionFailed <<< "$err"; then
              echo "::error::put ${key} failed: ${err}"
              return 1
            fi
            local live_size local_size
            live_size=$(aws s3api head-object --bucket "$R2_BUCKET" --key "$key" \
              --endpoint-url "$ENDPOINT" --region auto --query ContentLength --output text)
            local_size=$(stat -c %s "$file")
            if [ "$live_size" != "$local_size" ]; then
              echo "::error::${key} already exists with ${live_size} bytes; this run has ${local_size} — a dl/ object is never overwritten"
              return 1
            fi
            echo "kept ${key} (already live, ${live_size} bytes)"
          }
          export -f put_dl
          find processed_files -maxdepth 1 -type f \
            ! -name 'latest*.yml' ! -name 'beta*.yml' ! -name 'versions.json' -print0 \
            | sort -z | xargs -0 -P 8 -n 1 bash -c 'put_dl "$1"' _

      # The GitHub release page stays the human-browsable home and a
      # redundant copy of every artifact — machine contracts point at
      # the feed. Created as a DRAFT: the assets upload here, the feed
      # pointers move next, and the page goes public as the last step
      # — nobody sees a release whose feed is not yet complete, and a
      # failure between here and the flip leaves an invisible draft,
      # not a public page with stale pointers.
      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: "${{ github.ref_name }}"
          draft: true
          prerelease: ${{ steps.release_type.outputs.is_prerelease == 'true' }}
          name: "${{ github.ref_name }}"
          files: processed_files/*
          fail_on_unmatched_files: true
          body_path: release_body.md
          generate_release_notes: false
          # The body is generated whole every run — appending would
          # double it when the action re-finds an existing release.
          append_body: false

      # Two tiers, so a reader can never see an index that names bytes
      # not yet on the feed: first the immutable objects (apt pool debs,
      # rpm Packages, hash-prefixed repodata, changelog entries and
      # assets, the archive keys), eight at a time — pool debs and rpms
      # are copied bucket-internally from the dl/ objects uploaded
      # above, not egressed twice; then the mutable indexes and
      # pointers one at a time in dependency order (apt Packages →
      # Release → Release.gpg → InRelease; repomd.xml → its signature;
      # changelog views; the installer scripts; desktop/<channel>/*.yml;
      # versions/<channel>.json last — the manifest that names the
      # release to every client).
      - name: Upload update feed to R2
        if: steps.r2.outputs.enabled == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          # aws-cli ≥ 2.23 defaults to CRC32 request checksums, which
          # R2's S3 layer rejects.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          export ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          put_feed() {
            local file="$1" key type cache name
            key="${file#feed/}"
            name="$(basename "$file")"
            case "$file" in
              *.yml)  type="text/yaml" ;;
              *.json) type="application/json" ;;
              *.md)   type="text/markdown; charset=utf-8" ;;
              *.ps1)  type="text/plain; charset=utf-8" ;;
              *.txt)  type="text/plain; charset=utf-8" ;;
              *.sh)   type="text/x-shellscript; charset=utf-8" ;;
              *.asc)  type="text/plain; charset=utf-8" ;;
              *.webp) type="image/webp" ;;
              *.png)  type="image/png" ;;
              *.deb)  type="application/vnd.debian.binary-package" ;;
              *.rpm)  type="application/x-rpm" ;;
              *.xml)  type="text/xml; charset=utf-8" ;;
              *.gz)   type="application/gzip" ;;
              *.gpg)  type="application/pgp-signature" ;;
              */Release|*/InRelease|*/Packages) type="text/plain; charset=utf-8" ;;
              *)      type="application/octet-stream" ;;
            esac
            # Short cache so a fresh release is visible within minutes
            # of the pointer upload — clients check at most daily.
            # Changelog assets, per-beta snapshots, apt pool debs, rpm
            # pool rpms, and the hash-prefixed repodata indexes never
            # change once shipped — those cache as immutable. repomd.xml
            # (and its signature) is the one mutable rpm index name, so
            # it stays on the short-cache default.
            case "$key" in
              rpm/*/repodata/repomd.xml*)
                cache="public, max-age=300, must-revalidate" ;;
              changelog/assets/*|changelog/*-beta.*.json|apt/*/pool/*|rpm/*/Packages/*|rpm/*/repodata/*)
                cache="public, max-age=31536000, immutable" ;;
              *)
                cache="public, max-age=300, must-revalidate" ;;
            esac
            case "$key" in
              apt/*/pool/*|rpm/*/Packages/*)
                # The same bytes already live under dl/<tag>/ — a
                # bucket-internal copy, no second egress from the runner.
                if [ -f "processed_files/${name}" ]; then
                  aws s3api copy-object --bucket "$R2_BUCKET" --key "$key" \
                    --copy-source "${R2_BUCKET}/dl/${GITHUB_REF_NAME}/${name}" \
                    --endpoint-url "$ENDPOINT" --region auto \
                    --metadata-directive REPLACE \
                    --content-type "$type" --cache-control "$cache" >/dev/null
                  echo "copied ${key} from dl/${GITHUB_REF_NAME}/${name}"
                  return 0
                fi ;;
            esac
            aws s3 cp "$file" "s3://${R2_BUCKET}/${key}" \
              --endpoint-url "$ENDPOINT" --region auto \
              --content-type "$type" \
              --cache-control "$cache" \
              --no-progress
          }
          export -f put_feed

          # The mutable tier, ranked; everything else is an immutable
          # object and goes first.
          index_rank() {
            case "$1" in
              apt/*/dists/*/Packages|apt/*/dists/*/Packages.gz) echo 10 ;;
              apt/*/dists/*/Release)     echo 11 ;;
              apt/*/dists/*/Release.gpg) echo 12 ;;
              apt/*/dists/*/InRelease)   echo 13 ;;
              rpm/*/repodata/repomd.xml)     echo 20 ;;
              rpm/*/repodata/repomd.xml.asc) echo 21 ;;
              changelog/*/*) echo "" ;;
              changelog/*.json) echo 30 ;;
              llms.txt)     echo 31 ;;
              install.sh|install.ps1) echo 40 ;;
              desktop/*)    echo 50 ;;
              versions/*)   echo 60 ;;
              *) echo "" ;;
            esac
          }
          : > objects.txt
          : > indexes.txt
          while read -r file; do
            rank=$(index_rank "${file#feed/}")
            if [ -n "$rank" ]; then
              echo "${rank} ${file}" >> indexes.txt
            else
              echo "$file" >> objects.txt
            fi
          done < <(find feed -type f | sort)

          echo "immutable objects: $(wc -l < objects.txt), indexes and pointers: $(wc -l < indexes.txt)"
          if [ -s objects.txt ]; then
            tr '\n' '\0' < objects.txt | xargs -0 -P 8 -n 1 bash -c 'put_feed "$1"' _
          fi
          sort -n -k1,1 -k2 indexes.txt | while read -r rank file; do
            put_feed "$file"
          done

      # The last pointer to move: the page goes public only once every
      # byte and every feed pointer it names is live.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" --draft=false

      # `:latest` moves after the feed pointers, by manifest reference
      # — no image pull, the version tag's manifest is re-tagged in the
      # registry. Stable only: the binaries leg that pushed the version
      # tag never runs on a beta.
      - name: Promote ohd image to latest
        if: steps.release_type.outputs.is_prerelease == 'false' && github.repository_owner == 'OpenHeaders'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OHD_VERSION=$(node -p "require('./apps/daemon/package.json').version")
          IMAGE=ghcr.io/openheaders/ohd
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$OHD_VERSION"
          docker logout ghcr.io
