name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Cache Electron
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install Electron system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libasound2t64 libgbm1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: pnpm biome check . || echo "::warning::Lint issues found — see output above"

      - name: Typecheck all packages
        run: pnpm turbo typecheck

      - name: i18n hardcoded-string scan
        run: pnpm turbo scan:i18n

      - name: i18n locale-catalog lint
        run: pnpm turbo lint:i18n-locales

      - name: Test core
        run: |
          echo "### Core" >> $GITHUB_STEP_SUMMARY
          pnpm --filter @openheaders/core test -- --reporter=default --reporter=github-actions

      - name: Test extension
        run: |
          echo "### Browser Extension" >> $GITHUB_STEP_SUMMARY
          pnpm --filter @openheaders/extension test -- --reporter=default --reporter=github-actions

      - name: Test desktop
        run: |
          echo "### Desktop App" >> $GITHUB_STEP_SUMMARY
          pnpm --filter @openheaders/desktop test -- --reporter=default --reporter=github-actions

      - name: Build all packages
        run: pnpm turbo build

      # Ubuntu 24.04 confines unprivileged user namespaces behind AppArmor,
      # which breaks Electron's sandbox under xvfb.
      - name: Allow unprivileged user namespaces for the Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: E2E — CLI provisioning (desktop + oh + pty)
        run: |
          echo "### E2E — CLI provisioning" >> $GITHUB_STEP_SUMMARY
          xvfb-run --auto-servernum pnpm --filter @openheaders/desktop exec playwright test --trace retain-on-failure tests/e2e/cli-provision.spec.ts

      - name: Upload e2e traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-provision-e2e-results
          path: apps/desktop/tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
