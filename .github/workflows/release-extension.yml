name: Release Extension

on:
  push:
    tags:
      - 'v*-ext*'

permissions:
  contents: write

env:
  R2_BUCKET: oh-updates

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Parse extension version from tag
        id: parse_tag
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          # v4.1.4-ext-beta.1 → 4.1.4-beta.1 (beta), v4.1.4-ext → 4.1.4 (stable)
          if [[ "$RAW" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-ext-beta\.([0-9]+)$ ]]; then
            TAG="${BASH_REMATCH[1]}-beta.${BASH_REMATCH[2]}"
          elif [[ "$RAW" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-ext$ ]]; then
            TAG="${BASH_REMATCH[1]}"
          else
            echo "::error::Tag $GITHUB_REF_NAME does not match expected pattern v*-ext or v*-ext-beta.N"
            exit 1
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Verify extension version matches tag
        working-directory: apps/extension
        run: |
          TAG="${{ steps.parse_tag.outputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          # Extract base version (strip -beta.N suffix)
          TAG_BASE=$(echo "$TAG" | sed 's/-beta\.[0-9]*$//')
          PKG_BASE=$(echo "$PKG_VERSION" | sed 's/-beta\.[0-9]*$//')

          if [ "$TAG_BASE" != "$PKG_BASE" ]; then
            echo "::error::Version mismatch! Tag base is $TAG_BASE but apps/extension/package.json base is $PKG_BASE"
            echo "::error::Bump apps/extension/package.json to $TAG_BASE and commit before tagging."
            exit 1
          fi

          echo "Extension version verified: tag=$TAG, package.json=$PKG_VERSION (base: $TAG_BASE)"

          # Set the full tag version in package.json for the build
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json'));p.version='$TAG';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Align manifests with version
        working-directory: apps/extension
        run: |
          TAG="${{ steps.parse_tag.outputs.version }}"

          if [[ "$TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-beta\.([0-9]+)$ ]]; then
            MANIFEST_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          else
            MANIFEST_VERSION="$TAG"
          fi

          for manifest in manifests/*/manifest.json; do
            node -e "const fs=require('fs'),m=JSON.parse(fs.readFileSync('$manifest'));m.version='$MANIFEST_VERSION';fs.writeFileSync('$manifest',JSON.stringify(m,null,2)+'\n')"
          done

      - name: Build core package
        run: pnpm --filter @openheaders/core build

      # OH_EXT_CHANNEL=release ships fully mangled builds; store
      # packages are built without it (review-permissive).
      - name: Build and package extensions
        working-directory: apps/extension
        run: pnpm release
        env:
          OH_EXT_CHANNEL: release

      - name: Determine release type
        id: release_type
        run: |
          if [[ "${{ github.ref_name }}" =~ -ext-beta\.[0-9]+$ ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Body
        id: ext_repo
        run: |
          TAG="${{ steps.parse_tag.outputs.version }}"
          EXT_REPO_TAG="v${TAG}"
          echo "tag=${EXT_REPO_TAG}" >> $GITHUB_OUTPUT
          IS_PRERELEASE="${{ steps.release_type.outputs.is_prerelease }}"

          if [ "$IS_PRERELEASE" = "true" ]; then
            # Beta releases publish NO extension zips — betas install
            # through the unlisted store listings only.
            {
              echo '> **This is a beta build for early testing.** It may contain bugs.'
              echo ''
              echo '## Installation'
              echo ''
              echo 'Beta builds carry their own extension ids and install through unlisted store listings — install links land here once those listings are published.'
            } > release_body.md
          else
            REPO_BASE="https://github.com/OpenHeaders/open-headers/releases/download/${EXT_REPO_TAG}"
            {
              echo '## Installation'
              echo ''
              echo "Install from your browser's store:"
              echo ''
              echo '- [Chrome Web Store](https://chromewebstore.google.com/detail/ablaikadpbfblkmhpmbbnbbfjoibeejb)'
              echo '- [Edge Add-ons](https://microsoftedge.microsoft.com/addons/detail/gnbibobkkddlflknjkgcmokdlpddegpo)'
              echo '- Firefox (AMO): listing pending'
              echo ''
              echo "## Build artifacts"
              echo ""
              echo "- [Chrome](${REPO_BASE}/open-headers-chrome-v${TAG}.zip)"
              echo "- [Firefox](${REPO_BASE}/open-headers-firefox-v${TAG}.zip)"
              echo "- [Edge](${REPO_BASE}/open-headers-edge-v${TAG}.zip)"
              echo ""
              echo "These zips are the raw, unsigned build artifacts, attached for source review and development — install the extension through the store listings."
            } > release_body.md
          fi

      # Extension-only releases land on the same public flagship repo
      # as the full release train (DISTRIBUTION_PLAN §2) — the `v*-ext`
      # source tag maps to a plain `vX.Y.Z` extension tag there.
      # Stable attaches the raw build zips; beta attaches nothing.
      - name: Publish to flagship repo (stable)
        if: steps.release_type.outputs.is_prerelease == 'false'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASES_PAT }}
          repository: OpenHeaders/open-headers
          tag_name: ${{ steps.ext_repo.outputs.tag }}
          draft: false
          prerelease: false
          name: ${{ steps.ext_repo.outputs.tag }}
          files: apps/extension/releases/*.zip
          body_path: release_body.md

      - name: Publish to flagship repo (beta)
        if: steps.release_type.outputs.is_prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASES_PAT }}
          repository: OpenHeaders/open-headers
          tag_name: ${{ steps.ext_repo.outputs.tag }}
          draft: false
          prerelease: true
          name: ${{ steps.ext_repo.outputs.tag }}
          body_path: release_body.md

      - name: Check R2 credentials
        id: r2
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::R2 secrets not configured — versions manifest not updated this release"
          fi
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # Patch ONLY the extension entry of the channel's versions
      # manifest — the desktop/cli/daemon entries ride through
      # untouched, so this lane can never move another app's contract.
      - name: Update extension entry on the update feed
        if: steps.r2.outputs.enabled == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [[ "${{ github.ref_name }}" =~ -ext-beta\.[0-9]+$ ]]; then
            CHANNEL=beta
          else
            CHANNEL=stable
          fi
          EXT_VERSION="${{ steps.parse_tag.outputs.version }}"
          EXT_TAG="${{ steps.ext_repo.outputs.tag }}"

          # Current manifest from the feed; a channel that has never
          # published starts from an empty object.
          if ! curl -fsS "https://updates.openheaders.io/versions/${CHANNEL}.json" -o current.json; then
            echo '{}' > current.json
          fi

          node scripts/patch-versions-entry.mjs current.json extension \
            "{\"latest\":\"${EXT_VERSION}\",\"tag\":\"${EXT_TAG}\",\"severity\":\"normal\"}" > patched.json
          cat patched.json

          aws s3 cp patched.json "s3://${R2_BUCKET}/versions/${CHANNEL}.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --region auto \
            --content-type "application/json" \
            --cache-control "public, max-age=300, must-revalidate" \
            --no-progress
