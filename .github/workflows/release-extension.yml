name: Release Extension

# Stable only: the extension has no beta channel — stores are its one
# distribution, and the beta versions manifest carries no extension
# entry.
on:
  push:
    tags:
      - 'v*-ext'

permissions:
  contents: write

env:
  R2_BUCKET: oh-updates

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Parse extension version from tag
        id: parse_tag
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          # v4.1.4-ext → 4.1.4
          if [[ "$RAW" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-ext$ ]]; then
            TAG="${BASH_REMATCH[1]}"
          else
            echo "::error::Tag $GITHUB_REF_NAME does not match expected pattern v*-ext"
            exit 1
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Verify extension version matches tag
        working-directory: apps/extension
        run: |
          TAG="${{ steps.parse_tag.outputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch! Tag says $TAG but apps/extension/package.json says $PKG_VERSION"
            echo "::error::Bump apps/extension/package.json to $TAG and commit before tagging."
            exit 1
          fi

          echo "Extension version verified: tag=$TAG, package.json=$PKG_VERSION"

      - name: Align manifests with version
        working-directory: apps/extension
        run: |
          TAG="${{ steps.parse_tag.outputs.version }}"
          for manifest in manifests/*/manifest.json; do
            node -e "const fs=require('fs'),m=JSON.parse(fs.readFileSync('$manifest'));m.version='$TAG';fs.writeFileSync('$manifest',JSON.stringify(m,null,2)+'\n')"
          done

      - name: Build core package
        run: pnpm --filter @openheaders/core build

      # OH_EXT_CHANNEL=release ships fully mangled builds; store
      # packages are built without it (review-permissive).
      - name: Build and package extensions
        working-directory: apps/extension
        run: pnpm release
        env:
          OH_EXT_CHANNEL: release
          # The three-browser vite build exceeds the runner's default
          # heap (first hit at 2026.8.0).
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Check R2 credentials
        id: r2
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::R2 secrets not configured — versions manifest not updated this release"
          fi
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # Patch ONLY the extension entry of the STABLE versions manifest
      # — the desktop/cli/daemon entries ride through untouched, so
      # this lane can never move another app's contract. The beta
      # manifest carries no extension entry, ever. No flagship release
      # is published for `-ext` tags — store listings are the
      # extension's only public surface; the build above is a
      # verification gate and its zips are discarded.
      - name: Update extension entry on the update feed
        if: steps.r2.outputs.enabled == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          EXT_VERSION="${{ steps.parse_tag.outputs.version }}"
          EXT_TAG="v${EXT_VERSION}"

          # Current manifest from the feed; a channel that has never
          # published starts from an empty object.
          if ! curl -fsS "https://updates.openheaders.io/versions/stable.json" -o current.json; then
            echo '{}' > current.json
          fi

          node scripts/patch-versions-entry.mjs current.json extension \
            "{\"latest\":\"${EXT_VERSION}\",\"tag\":\"${EXT_TAG}\",\"severity\":\"normal\"}" > patched.json
          cat patched.json

          aws s3 cp patched.json "s3://${R2_BUCKET}/versions/stable.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --region auto \
            --content-type "application/json" \
            --cache-control "public, max-age=300, must-revalidate" \
            --no-progress
