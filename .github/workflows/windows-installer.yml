name: Windows Installer

# Path-gated: whenever the installer program moves, its tests run — they
# need no Windows — and the program is built for both arches the way a
# release leg builds it: each arch on a runner of its own, where the
# app's tree that carries it is packed.

on:
  push:
    branches: [main]
    paths:
      - 'native/windows-installer/**'
      - 'scripts/build-windows-installer.mjs'
      - 'apps/desktop/build/windows/AppxManifest.xml'
      - 'apps/desktop/build/icon.ico'
      - 'apps/desktop/build/icon.png'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native/windows-installer/**'
      - 'scripts/build-windows-installer.mjs'
      - 'apps/desktop/build/windows/AppxManifest.xml'
      - 'apps/desktop/build/icon.ico'
      - 'apps/desktop/build/icon.png'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo (Windows installer)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/windows-installer/target
          key: ${{ runner.os }}-windows-installer-${{ hashFiles('native/windows-installer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-windows-installer-

      - name: Run the installer's tests
        run: cargo test --manifest-path native/windows-installer/Cargo.toml

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: windows-11-arm
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Cache cargo (Windows installer)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/windows-installer/target
          key: ${{ runner.os }}-${{ matrix.arch }}-windows-installer-${{ hashFiles('native/windows-installer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-windows-installer-

      - name: Build the installer for this runner's arch
        run: node scripts/build-windows-installer.mjs "win-${{ matrix.arch }}"
        shell: bash

      # The program started on this Windows, with no window: a switch it
      # does not take must end it with its own code for that, and leave
      # its log — the proof that it starts and reaches its own code. A
      # run whose switches it refuses writes its log where a run without
      # `--log` does, in the user's temp folder.
      - name: Start the installer with a switch it refuses
        shell: bash
        run: |
          set +e
          "native/windows-installer/dist/win-${{ matrix.arch }}/OpenHeaders-Installer-${{ matrix.arch }}.exe" --silent --no-launch --channel nightly
          code=$?
          cat "$LOCALAPPDATA/Temp/OpenHeaders-Installer.log"
          if [ "$code" != "2" ]; then
            echo "::error::a bad switch should end with 2, the installer ended with $code"
            exit 1
          fi
