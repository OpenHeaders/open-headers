name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Which app
      options:
        - Desktop app
        - Browser extension
        - CLI (oh)
        - Daemon (ohd)
        - Web app
        - Not sure / several
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "Desktop: Settings → About. Extension: your browser's extensions page. CLI/daemon: `oh --version` / `ohd --version`."
      placeholder: e.g. 2026.7.17
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other / multiple
    validations:
      required: true
  - type: input
    id: platform-detail
    attributes:
      label: OS version / browser
      description: OS version, plus browser and browser version if this is about the extension.
      placeholder: e.g. macOS 15.5, Chrome 138
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
