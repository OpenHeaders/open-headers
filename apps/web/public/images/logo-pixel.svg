<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5890FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A7FE8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="80" fill="url(#bgGrad)"/>

  <g transform="translate(32 32) scale(0.875)">
    <g fill="white" filter="url(#shadow)" shape-rendering="crispEdges">
      <rect x="80"  y="112" width="128" height="32"/>
      <rect x="48"  y="144" width="64"  height="160"/>
      <rect x="176" y="144" width="64"  height="160"/>
      <rect x="80"  y="304" width="128" height="32"/>

      <rect x="272" y="112" width="64"  height="224"/>
      <rect x="400" y="112" width="64"  height="224"/>
      <rect x="272" y="208" width="192" height="32"/>
    </g>

    <rect x="112" y="144" width="64" height="160" fill="#FF4444" shape-rendering="crispEdges"/>

    <path d="M 80 388 C 180 448, 332 448, 432 388" stroke="white" stroke-width="28" fill="none" stroke-linecap="round" filter="url(#shadow)"/>
  </g>
</svg>
