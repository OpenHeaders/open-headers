<?xml version="1.0" encoding="UTF-8"?>
<!--
  Monochrome template variant of logo.svg for the macOS menu-bar tray:
  filled rounded square, pixel letters as cutouts (negative space), the
  recording block inside the O kept visible. Artwork geometry MUST stay
  in sync with logo.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <mask id="letterMask">
      <!-- White background = visible -->
      <rect width="512" height="512" fill="white"/>
      <g transform="translate(32 32) scale(0.875)">
        <!-- Black shapes = transparent (cutouts) -->
        <g fill="black" shape-rendering="crispEdges">
          <rect x="80"  y="112" width="128" height="32"/>
          <rect x="48"  y="144" width="64"  height="160"/>
          <rect x="176" y="144" width="64"  height="160"/>
          <rect x="80"  y="304" width="128" height="32"/>

          <rect x="272" y="112" width="64"  height="224"/>
          <rect x="400" y="112" width="64"  height="224"/>
          <rect x="272" y="208" width="192" height="32"/>
        </g>
        <path d="M 80 388 C 180 448, 332 448, 432 388" stroke="black" stroke-width="28" fill="none" stroke-linecap="round"/>
        <!-- Recording block inside the O stays visible -->
        <rect x="112" y="144" width="64" height="160" fill="white" shape-rendering="crispEdges"/>
      </g>
    </mask>
  </defs>

  <!-- Rounded square with mask applied -->
  <rect width="512" height="512" rx="80" fill="black" mask="url(#letterMask)"/>
</svg>
