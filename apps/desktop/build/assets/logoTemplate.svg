<?xml version="1.0" encoding="UTF-8"?>
<!--
  Monochrome knockout of logo-pixel.svg for the macOS menu-bar tray:
  the exact dock tile — same plate radius, same glyph geometry — with
  the letters and smile cut to transparency. A template image is
  alpha-only, so the blue plate becomes ink the OS recolors, and the
  red recording block survives automatically: its region is plate
  showing through the O's counter, separated on all four sides by the
  cut-out white bars. Rasterized to iconTemplate.png (16px) and
  iconTemplate@2x.png (32px).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <mask id="glyph">
      <rect width="512" height="512" fill="white"/>
      <g transform="translate(32 32) scale(0.875)">
        <g fill="black" shape-rendering="crispEdges">
          <rect x="80"  y="112" width="128" height="32"/>
          <rect x="48"  y="144" width="64"  height="160"/>
          <rect x="176" y="144" width="64"  height="160"/>
          <rect x="80"  y="304" width="128" height="32"/>

          <rect x="272" y="112" width="64"  height="224"/>
          <rect x="400" y="112" width="64"  height="224"/>
          <rect x="272" y="208" width="192" height="32"/>
        </g>
        <path d="M 80 388 C 180 448, 332 448, 432 388" stroke="black" stroke-width="28" fill="none" stroke-linecap="round"/>
      </g>
    </mask>
  </defs>
  <rect width="512" height="512" rx="80" fill="black" mask="url(#glyph)"/>
</svg>
