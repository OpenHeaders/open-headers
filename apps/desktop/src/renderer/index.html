<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'sha256-+jShmRaJnYpvtxHjj5uAfv3g+pTwQcDTJpcjUNmPZUY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self';"
    />
    <title>Open Headers</title>
    <style>
      /*
       * Native title-bar reservation. The BrowserWindow is created with
       * `titleBarStyle: 'hiddenInset'` (macOS) / `titleBarOverlay`
       * (Windows + Linux) so the OS chrome (traffic lights / min-max-
       * close) draws over the renderer's top edge — see `src/main.ts`.
       * We reserve a fixed-height drag region at the top of the
       * document so the user can still grab "empty" toolbar space to
       * move the window, and pad the toolbar from the platform edge so
       * its leftmost item (the OH logo) doesn't sit under the lights.
       *
       * Marked `pointer-events: none` so the layer only consumes the
       * drag affordance; clicks on buttons in the renderer toolbar
       * pass through normally. Interactive controls inside the
       * renderer can opt back into being draggable individually by
       * setting `-webkit-app-region: no-drag` on themselves if needed.
       */
      .oh-titlebar-drag-region {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 40px;
        z-index: 9999;
        pointer-events: none;
        -webkit-app-region: drag;
      }

      /*
       * Native title-bar reservation on the workbench top toolbar.
       * `.rules-topbar` is the workbench's chrome row
       * (`packages/ui/src/workbench/components/TopBar.tsx`); on macOS
       * we shift its first child past the inset traffic lights, and on
       * Windows/Linux we reserve room on the right for the
       * `titleBarOverlay` controls. The chrome row doubles as the
       * window-drag affordance so the user can grab empty toolbar
       * space to move the window — interactive controls opt back out
       * via `no-drag`.
       *
       * `!important` is load-bearing: `packages/ui`'s rules.less sets
       * `.rules-topbar { padding: 4px 0; }` later in the cascade,
       * which would otherwise zero our `padding-left` /
       * `padding-right`. The reservation is structural and MUST win.
       */
      body.host-darwin .rules-topbar {
        padding-left: 84px !important;
      }
      body.host-win32 .rules-topbar,
      body.host-linux .rules-topbar {
        padding-right: 144px !important;
      }
      .rules-topbar {
        -webkit-app-region: drag;
      }
      .rules-topbar button,
      .rules-topbar a,
      .rules-topbar input,
      .rules-topbar select,
      .rules-topbar [role='button'],
      .rules-topbar .ant-select,
      .rules-topbar .ant-input,
      .rules-topbar .ant-input-affix-wrapper,
      .rules-topbar .ant-btn,
      .rules-topbar .rules-topbar-search,
      .rules-topbar .rules-panel-toggle {
        -webkit-app-region: no-drag;
      }

      /*
       * Boot shell — painted inside #root so React's createRoot.render()
       * naturally replaces it on mount. Themed via prefers-color-scheme
       * (overridden by [data-oh-theme] which preload sets from
       * `nativeTheme.shouldUseDarkColors` before HTML scripts run).
       * Goal: window's `ready-to-show` fires on this paint, not on the
       * React bundle's first paint — so the window appears in well under
       * a second instead of waiting on Vite / bundle parse / initial RPCs.
       */
      html, body { margin: 0; height: 100%; background: #ffffff; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      html[data-oh-theme='dark'], html[data-oh-theme='dark'] body { background: #1f1f1f; color: #e6e6e6; }
      @media (prefers-color-scheme: dark) {
        html:not([data-oh-theme='light']), html:not([data-oh-theme='light']) body { background: #1f1f1f; color: #e6e6e6; }
      }
      #root { height: 100%; }
      .oh-boot-shell { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 14px; -webkit-app-region: drag; user-select: none; }
      .oh-boot-shell__mark { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; opacity: 0.92; }
      .oh-boot-shell__spinner { width: 22px; height: 22px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; opacity: 0.6; animation: oh-boot-spin 720ms linear infinite; }
      .oh-boot-shell__hint { font-size: 12px; opacity: 0.55; }
      @keyframes oh-boot-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // Apply theme before first paint so the boot shell doesn't flash
      // the wrong palette. `window.oh.startupData` is populated by the
      // preload via `sendSync` and is available before HTML scripts run.
      (function () {
        var theme = window.oh && window.oh.startupData && window.oh.startupData.theme;
        if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-oh-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div class="oh-titlebar-drag-region" aria-hidden="true"></div>
    <div id="root">
      <div class="oh-boot-shell" role="status" aria-live="polite">
        <div class="oh-boot-shell__spinner" aria-hidden="true"></div>
        <div class="oh-boot-shell__mark">Open Headers</div>
        <div class="oh-boot-shell__hint">Starting…</div>
      </div>
    </div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
