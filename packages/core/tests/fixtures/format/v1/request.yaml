schemaVersion: 5
uid: reqlogin
name: Login
description: |
  Exchanges credentials for an access token. Pre-request script seeds
  the temporary client id; post-response test records the `Set-Cookie`
  jar into the team-shared secrets drawer.
method: POST
url: "{{API_URL}}/auth/login"
headers:
  - uid: hdrct001
    key: Content-Type
    value: application/json
params:
  - uid: prmaud01
    key: audit
    value: dev
    enabled: false
auth:
  type: bearer
  token: "{{env.TOKEN}}"
credentialsMode: omit
followRedirects: false
body:
  type: json
