schemaVersion: 5
uid: reqlogin
name: Login
description: |
  Exchanges credentials for an access token. Pre-request script seeds
  the temporary client id; post-response test records the `Set-Cookie`
  jar into the team-shared secrets drawer.
method: POST
url: "{{API_URL}}/auth/login"
headers:
  - uid: hdrct001
    key: Content-Type
    value: application/json
params:
  - uid: prmaud01
    key: audit
    value: dev
    enabled: false
auth:
  type: bearer
  token: "{{env.TOKEN}}"
credentialsMode: omit
followRedirects: false
sslVerification: false
tlsMinVersion: "1.1"
tlsMaxVersion: "1.2"
tlsCipherSuites: TLS_AES_128_GCM_SHA256:ECDHE-RSA-AES128-GCM-SHA256
timeoutMs: 15000
maxResponseBytes: 4096
maxRedirects: 5
followOriginalHttpMethod: true
followAuthorizationHeader: true
body:
  type: json
