schemaVersion: 5
uid: wfdagfan
name: Two-Parent Fan-In
description: Two independent root steps (explicit dependsOn [] declares them as parallel roots) both feed a single descendant. The descendant's request template references both parents' captures via {{step.X.Y}} — exercises transitive-ancestor reachability for template validation. Sequential execution still applies in v1 (roots run in declared order; descendant runs after both).
enabled: true
refresh:
  kind: manual
steps:
  - uid: stpfusr0
    id: fetchUser
    requestUid: requser1
    captures:
      - uid: capusrid
        name: userId
        extractor:
          kind: json-path
          path: $.id
    dependsOn: []
  - uid: stpftem0
    id: fetchTeam
    requestUid: reqteam1
    captures:
      - uid: captemid
        name: teamId
        extractor:
          kind: json-path
          path: $.team_id
    dependsOn: []
  - uid: stpaggrt
    id: aggregate
    requestUid: reqaggr1
    captures:
      - uid: capcomky
        name: combinedKey
        extractor:
          kind: json-path
          path: $.key
    dependsOn:
      - fetchUser
      - fetchTeam
