schemaVersion: 5
uid: wflow002
name: CSRF-Protected Auth Chain
description: Three-step dance — login sets session cookie, /csrf returns a token, /finalize exchanges both for an access token.
enabled: true
refresh:
  kind: expires-in
  stepId: finalize
  captureName: expires_in
  leadSeconds: 120
steps:
  - uid: stplogin
    id: login
    description: Issue session cookie via POST /login.
    requestUid: reqlog01
    captures:
      - uid: capsesid
        name: sessionId
        extractor:
          kind: json-path
          path: $.session_id
  - uid: stpcsrfx
    id: csrf
    description: Fetch CSRF token with the session cookie attached.
    requestUid: reqcsr01
    captures:
      - uid: captoken
        name: token
        extractor:
          kind: header
          name: X-CSRF-Token
  - uid: stpfinal
    id: finalize
    description: Exchange session + csrf for the final access token.
    requestUid: reqfin01
    captures:
      - uid: capaccst
        name: access_token
        extractor:
          kind: json-path
          path: $.access_token
      - uid: capexpin
        name: expires_in
        extractor:
          kind: json-path
          path: $.expires_in
