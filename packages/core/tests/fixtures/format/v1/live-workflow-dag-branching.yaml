schemaVersion: 5
uid: wfdagbrn
name: Probe-Driven Branching
description: Probe step decides which of two paths runs. pathA runs when the probe's flag capture equals "a"; pathB runs when it equals "b". Mutually exclusive gates are the v1 OR-workaround until the Any-of-clauses toggle ships. Both paths depend on probe but are siblings — neither depends on the other.
enabled: true
refresh:
  kind: manual
steps:
  - uid: stpprobe
    id: probe
    requestUid: reqprob2
    captures:
      - uid: capflag0
        name: flag
        extractor:
          kind: json-path
          path: $.flag
      - uid: caphttps
        name: httpStatus
        extractor:
          kind: status-code
  - uid: stppatha
    id: pathA
    requestUid: reqpatha
    captures:
      - uid: capresla
        name: resultA
        extractor:
          kind: json-path
          path: $.result
    dependsOn:
      - probe
    runIf:
      all:
        - kind: status
          uid: gat0sta1
          stepId: probe
          match: 2xx
        - kind: capture-equals
          uid: gat0eqfa
          stepId: probe
          captureName: flag
          value: a
  - uid: stppathb
    id: pathB
    requestUid: reqpathb
    captures:
      - uid: capreslb
        name: resultB
        extractor:
          kind: json-path
          path: $.result
    dependsOn:
      - probe
    runIf:
      all:
        - kind: status
          uid: gat0sta2
          stepId: probe
          match: 2xx
        - kind: capture-equals
          uid: gat0eqfb
          stepId: probe
          captureName: flag
          value: b
