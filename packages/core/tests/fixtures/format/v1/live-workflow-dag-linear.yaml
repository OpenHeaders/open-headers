schemaVersion: 5
uid: wfdaglin
name: Explicit Linear Chain
description: Three-step chain with explicit dependsOn declarations. Verifies that explicit dependsOn reproduces the implicit prior-step semantics — this workflow runs identically to the backwards-compat live-workflow-chain.yaml fixture.
enabled: true
refresh:
  kind: interval
  seconds: 300
steps:
  - uid: stpprobe
    id: probe
    requestUid: reqprob1
    captures:
      - uid: captoken
        name: token
        extractor:
          kind: json-path
          path: $.token
  - uid: stpintro
    id: introspect
    requestUid: reqintr1
    captures:
      - uid: capexpin
        name: expiresIn
        extractor:
          kind: json-path
          path: $.expires_in
    dependsOn:
      - probe
  - uid: stpfinal
    id: finalize
    requestUid: reqfin01
    captures:
      - uid: capacces
        name: accessToken
        extractor:
          kind: json-path
          path: $.access_token
    dependsOn:
      - introspect
