// BookService — the gRPC probe contract the stream-rider tests drive:
// unary, deadline, server-stream, client-stream and bidi shapes against
// probe-shaped h2c servers.
syntax = "proto3";

package openheaders.playground.v1;

service BookService {
  // Unary happy path. name "books/missing" answers NOT_FOUND as a
  // trailers-only reply; an empty name answers INVALID_ARGUMENT after
  // headers (status in trailers).
  rpc GetBook(GetBookRequest) returns (Book);
  // Responds after delay_ms — the deadline probe.
  rpc DelayedBook(DelayedBookRequest) returns (Book);
  // Server stream: emits count books (default 3), interval_ms apart
  // (default 25), named "<shelf>/watch-N", then OK trailers.
  rpc WatchBooks(WatchBooksRequest) returns (stream Book);
  // Client stream: counts uploaded books until half-close, then
  // answers one summary naming what arrived.
  rpc UploadBooks(stream UploadBookRequest) returns (UploadBooksSummary);
  // Bidi: echoes every message back ("echo: <text>" from author
  // "probe") as it arrives; client half-close ends with OK trailers.
  rpc Chat(stream ChatMessage) returns (stream ChatMessage);
}

message GetBookRequest {
  string name = 1;
}

message DelayedBookRequest {
  string name = 1;
  int32 delay_ms = 2;
}

message Book {
  string name = 1;
  string title = 2;
  string author = 3;
  int64 page_count = 4;
}

message WatchBooksRequest {
  string shelf = 1;
  int32 count = 2;
  int32 interval_ms = 3;
}

message UploadBookRequest {
  Book book = 1;
}

message UploadBooksSummary {
  int32 book_count = 1;
  repeated string names = 2;
}

message ChatMessage {
  string author = 1;
  string text = 2;
}
